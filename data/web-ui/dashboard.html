<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<title data-l="nav.sub_overview" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Dashboard</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
	/* The overview (Phase 4, variant A): what runs now as a band across the
	   page, the tiles below it shared out evenly over as few rows as the
	   width allows (webuiBalanceGrid: five as three and two), two to a row
	   on a narrow screen, one on a phone, where they stand one under the
	   other. 60 columns share out evenly to rows of one to six tiles; the
	   space between the tiles is their margin, as 59 gaps between the
	   columns would hold the grid at 944 px at least, wider than a phone and
	   than a laptop's window beside the side bar. */
	.webui-dashboard {
		display: grid;
		grid-template-columns: repeat(60, minmax(0, 1fr));
		column-gap: 0;
		row-gap: 1rem;
		max-width: var(--webui-page-max);
		margin: 0 auto;
		padding: 1rem 0.5rem;
	}

	/* a tile's foot stays at its bottom when its row is higher */
	.webui-dashboard > .webui-card {
		display: flex;
		flex-direction: column;
		grid-column: span var(--dash-span, 20);
		margin-inline: 0.5rem;
	}

	.webui-dashboard > .webui-card > .webui-card-body {
		flex: 1 1 auto;
	}

	/* across the page at every width, the narrower widths' rule for the
	   tiles included */
	.webui-dashboard > .webui-card.webui-dash-now {
		grid-column: 1 / -1;
	}

	@media (max-width: 1100px) {
		.webui-dashboard > .webui-card {
			grid-column: span 30;
		}
	}

	@media (max-width: 760px) {
		.webui-dashboard {
			row-gap: 0.75rem;
			padding: 0.75rem 0.375rem;
		}

		.webui-dashboard > .webui-card {
			grid-column: span 60;
			margin-inline: 0.375rem;
		}
	}

	.webui-dashboard .webui-card-title {
		font-size: 0.95rem;
	}

	.webui-card-value {
		margin-left: auto;
		color: var(--pico-muted-color);
		font-variant-numeric: tabular-nums;
		white-space: nowrap;
	}

	.webui-dashboard .webui-card-body {
		padding: 0.75rem 1rem;
	}

	.webui-dashboard .webui-card-footer {
		display: flex;
		justify-content: flex-end;
		padding: 0.4rem 1rem 0.75rem;
	}

	/* the band: logo, channel, programme, time and progress, the state,
	   then what records or plays, then the actions */
	.webui-now {
		display: grid;
		grid-template-columns: 64px minmax(0, 1fr) auto;
		gap: 0.75rem 1rem;
		align-items: center;
		padding: 1rem;
	}

	.webui-now-logo {
		display: grid;
		place-items: center;
		width: 64px;
		height: 64px;
		border-radius: var(--webui-radius);
		background: var(--webui-bg-elevated);
		overflow: hidden;
	}

	.webui-now-logo img {
		max-width: 56px;
		max-height: 56px;
		object-fit: contain;
	}

	.webui-now-logo svg {
		width: 28px;
		height: 28px;
		color: var(--pico-muted-color);
	}

	.webui-now h2 {
		margin: 0;
		font-size: 1.25rem;
		line-height: 1.25;
	}

	.webui-now-show {
		margin: 0.15rem 0 0;
		font-size: 1rem;
	}

	.webui-now-meta {
		margin-top: 0.1rem;
		color: var(--pico-muted-color);
		font-size: var(--webui-font-sm);
		font-variant-numeric: tabular-nums;
	}

	.webui-now-lines {
		display: grid;
		grid-column: 1 / -1;
		gap: 0.35rem;
	}

	.webui-now-lines:empty,
	.webui-now-line[hidden] {
		display: none;
	}

	.webui-now-line {
		display: flex;
		flex-wrap: wrap;
		gap: 0.25rem 0.6rem;
		align-items: center;
		padding: 0.45rem 0.7rem;
		border-radius: var(--webui-radius);
		background: var(--webui-bg-elevated);
		font-size: var(--webui-font-sm);
	}

	.webui-now-line b {
		font-weight: 600;
	}

	.webui-now-line small {
		color: var(--pico-muted-color);
	}

	.webui-now-line .webui-now-time {
		margin-left: auto;
		font-variant-numeric: tabular-nums;
	}

	.webui-now-actions {
		display: flex;
		flex-wrap: wrap;
		grid-column: 1 / -1;
		gap: 0.5rem;
		align-items: center;
	}

	.webui-now-actions .webui-seg {
		margin-left: auto;
	}

	.webui-now-actions .webui-btn svg {
		width: 1rem;
		height: 1rem;
	}

	@media (max-width: 760px) {
		.webui-now {
			grid-template-columns: 48px minmax(0, 1fr);
		}

		.webui-now-logo {
			width: 48px;
			height: 48px;
		}

		.webui-now-logo img {
			max-width: 42px;
			max-height: 42px;
		}

		#now-state {
			grid-column: 1 / -1;
			justify-self: start;
		}

		.webui-now-actions .webui-seg {
			margin-left: 0;
		}
	}

	/* rows of a tile: a time or a name in front, what it is, a state */
	.webui-dash-rows {
		margin: 0;
		padding: 0;
		list-style: none;
	}

	.webui-dash-row {
		display: grid;
		grid-template-columns: minmax(8ch, auto) minmax(0, 1fr) auto;
		gap: 0.6rem;
		align-items: center;
		margin: 0;
		padding: 0.45rem 0;
		border-top: 1px solid var(--pico-muted-border-color);
		font-size: var(--webui-font-sm);
	}

	.webui-dash-row:first-child {
		border-top: 0;
	}

	.webui-dash-row > b {
		font-weight: 550;
		font-variant-numeric: tabular-nums;
	}

	.webui-dash-row > span {
		min-width: 0;
		overflow-wrap: anywhere;
	}

	.webui-dash-row small {
		display: block;
		color: var(--pico-muted-color);
	}

	/* the box's values open the system information where it is there; kept
	   hidden while the tile says it could not read them */
	#system-body > [hidden] {
		display: none;
	}

	.webui-metrics {
		margin-bottom: 0.6rem;
	}

	/* A tile's values as one table (subgrid): the names of the bars and of
	   the rows below them in a first column as wide as the widest, the
	   bars in the second, their values in the third. Every bar starts and
	   ends where the others do, and the values of the rows below start
	   where the bars do. The parts keep their boxes, so the values that
	   open the system information stay a target to click and to focus. */
	.webui-dash-table {
		display: grid;
		grid-template-columns: max-content minmax(0, 1fr) max-content;
		column-gap: 0.75rem;
		align-content: start;
	}

	.webui-dash-table > *,
	.webui-dash-table .webui-metrics > .webui-meter,
	.webui-dash-table #tuner-list > *,
	.webui-dash-table .webui-tuner > *,
	.webui-dash-table .webui-dash-picture > * {
		grid-column: 1 / -1;
	}

	.webui-dash-table .webui-metrics,
	.webui-dash-table .webui-meter,
	.webui-dash-table .webui-kv,
	.webui-dash-table #tuner-list,
	.webui-dash-table .webui-tuner,
	.webui-dash-table .webui-dash-picture {
		display: grid;
		grid-template-columns: subgrid;
		column-gap: normal;
	}

	.webui-dash-table .webui-kv dd {
		grid-column: 2 / -1;
	}

	/* Pico colours a role="link" as a link: the values keep their own */
	.webui-ext-open,
	.webui-ext-open[role="link"] {
		--pico-color: inherit;
		color: inherit;
		cursor: pointer;
		border-radius: var(--webui-radius);
	}

	.webui-ext-open:is(:hover, :focus, :active),
	.webui-ext-open[role="link"]:is(:hover, :focus, :active) {
		/* Pico's button colour on hover, focus and press outweighs the reset above */
		--pico-color: inherit;
	}

	.webui-ext-open:hover {
		background: var(--webui-bg-elevated);
	}

	/* a tuner: its name and state, then signal and noise distance */
	.webui-tuner {
		padding: 0.4rem 0;
		border-top: 1px solid var(--pico-muted-border-color);
	}

	.webui-tuner:first-child {
		border-top: 0;
		padding-top: 0;
	}

	.webui-tuner-head {
		display: flex;
		gap: 0.5rem;
		align-items: center;
		font-size: var(--webui-font-sm);
	}

	.webui-tuner-head b {
		min-width: 0;
		overflow: hidden;
		font-weight: 550;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.webui-tuner-head small {
		color: var(--pico-muted-color);
		white-space: nowrap;
	}

	.webui-tuner-head .webui-pill {
		margin-left: auto;
	}

	.webui-tuner-channel {
		color: var(--pico-muted-color);
		font-size: var(--webui-font-sm);
	}

	.webui-dash-picture {
		margin-top: 0.75rem;
		padding-top: 0.6rem;
		border-top: 1px solid var(--pico-muted-border-color);
	}

	.webui-pids {
		display: flex;
		flex-wrap: wrap;
		gap: 0.3rem;
		margin-top: 0.5rem;
	}

	.webui-pids:empty {
		display: none;
	}

	.webui-pid-tag {
		padding: 0.05rem 0.4rem;
		border: 1px solid var(--pico-muted-border-color);
		border-radius: var(--webui-radius);
		font-family: var(--pico-font-family-monospace);
		font-size: 0.75rem;
	}

	.webui-pid-tag .label {
		color: var(--pico-muted-color);
		margin-right: 0.25rem;
	}

	/* quick actions, as high as a button whatever the tile's height */
	.webui-quick {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		align-content: flex-start;
		align-items: flex-start;
	}

	.webui-quick .webui-btn svg {
		width: 1rem;
		height: 1rem;
	}

	.webui-quick [hidden] {
		display: none;
	}

	/* the network's interfaces: a long name gives way, the address stays */
	.webui-net-row {
		grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto;
	}

	.webui-net-row > b,
	.webui-net-row small {
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.webui-net-row > b {
		font-family: var(--pico-font-family-monospace);
		font-weight: 500;
	}
	</style>
</head>
<body>
	<!-- Header wird dynamisch von webui-header.js generiert -->
	<div class="webui-header-wrapper" data-page="dashboard"></div>
	<div class="webui-header-spacer"></div>

	<main>
		<div class="webui-dashboard">
			<!-- what runs now -->
			<section class="webui-card webui-dash-now" id="card-now" aria-labelledby="now-channel">
				<div class="webui-now">
					<div class="webui-now-logo" id="now-logo" aria-hidden="true">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
					</div>
					<div>
						<h2 id="now-channel" data-l="msg.loading">Loading...</h2>
						<p class="webui-now-show" id="now-show"></p>
						<div class="webui-now-meta" id="now-meta"></div>
						<div class="webui-progress" id="now-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="now-show" hidden><span></span></div>
					</div>
					<span class="webui-pill" id="now-state" hidden></span>
					<div class="webui-now-lines">
						<div class="webui-now-line" id="rec-info" hidden>
							<span class="webui-pill rec" data-l="bc.recording">Recording</span>
							<b id="rec-title"></b>
							<small id="rec-channel"></small>
							<span class="webui-now-time" id="rec-remaining"></span>
						</div>
						<div class="webui-now-line" id="play-info" hidden>
							<span class="webui-pill ok" id="play-state" data-l="dash.playback">Playback</span>
							<b id="play-title"></b>
							<small id="play-source"></small>
							<span class="webui-now-time" id="play-time"></span>
						</div>
					</div>
					<div class="webui-now-actions">
						<button title="Record the programme running now, or stop its recording" data-l-title="tip.rec_now" type="button" class="webui-btn primary" id="rec-btn" onclick="toggleRecording()">
							<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
							<span data-l="dash.record">Record</span>
						</button>
						<button title="Title, time and text of the programme running now" data-l-title="tip.epg_info_now" type="button" class="webui-btn" onclick="showCurrentEpgInfo()">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
							<span data-l="dash.epg_info">Programme info</span>
						</button>
						<a title="Open the channel list" data-l-title="tip.open_channels" class="webui-btn" href="/bouquets.html" data-l="nav.sub_channels">Channels</a>
						<a title="Open the programme guide" data-l-title="tip.open_epg" class="webui-btn" href="/epg.html" data-l="nav.epg">EPG</a>
						<div class="webui-seg" role="group" aria-label="TV or radio" data-l-aria-label="dash.tv_or_radio">
							<button title="Switch the box to TV" data-l-title="tip.mode_tv" type="button" id="mode-tv" aria-pressed="true" onclick="switchMode('tv')" data-l="dash.tv">TV</button>
							<button title="Switch the box to radio" data-l-title="tip.mode_radio" type="button" id="mode-radio" aria-pressed="false" onclick="switchMode('radio')" data-l="dash.radio">Radio</button>
						</div>
					</div>
				</div>
			</section>

			<!-- the next timers -->
			<section class="webui-card" id="card-timer" aria-labelledby="timer-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="timer-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
						<span data-l="dash.next_timers">Upcoming timers</span>
					</h2>
					<span class="webui-card-value" id="timer-count"></span>
				</header>
				<div class="webui-card-body" id="timer-list"></div>
				<footer class="webui-card-footer">
					<a title="Open the timer list" data-l-title="tip.open_timers" href="/timer.html" class="webui-btn" data-l="dash.timer_list">Timer list</a>
				</footer>
			</section>

			<!-- the box -->
			<section class="webui-card" id="card-system" aria-labelledby="system-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="system-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>
						<span data-l="dash.box">Box</span>
					</h2>
					<span class="webui-card-value" id="temp-value"></span>
				</header>
				<div class="webui-card-body webui-dash-table" id="system-body">
					<div class="webui-metrics" data-ext-open="sysinfo" title="Show system details" data-l-title="dash.sys_details">
						<div class="webui-meter" id="meter-cpu"><b data-l="dash.cpu">CPU</b><div class="webui-progress"><span></span></div><span>--</span></div>
						<div class="webui-meter" id="meter-ram"><b data-l="dash.ram">RAM</b><div class="webui-progress"><span></span></div><span>--</span></div>
						<div class="webui-meter" id="meter-disk"><b data-l="dash.disk">Disk</b><div class="webui-progress"><span></span></div><span>--</span></div>
					</div>
					<dl class="webui-kv">
						<dt data-l="dash.uptime">Up for</dt><dd id="sys-uptime">--</dd>
						<dt data-l="dash.box_name">Box</dt><dd id="sys-box">--</dd>
						<dt data-l="dash.kernel">Kernel</dt><dd id="sys-kernel">--</dd>
					</dl>
				</div>
			</section>

			<!-- reception: the tuners, the picture, the sound -->
			<section class="webui-card" id="card-tuner" aria-labelledby="tuner-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="tuner-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20v-3M9 20v-7M14 20v-11M19 20V5"/></svg>
						<span data-l="dash.reception">Reception</span>
					</h2>
					<span class="webui-pill" id="tuner-quality" hidden></span>
				</header>
				<div class="webui-card-body webui-dash-table">
					<div id="tuner-list"></div>
					<div class="webui-dash-picture">
						<dl class="webui-kv">
							<dt data-l="bc.resolution">Resolution</dt><dd id="stream-resolution">--</dd>
							<dt data-l="dash.aspect">Aspect</dt><dd id="stream-aspect">--</dd>
							<dt data-l="dash.fps">Frame rate</dt><dd id="stream-fps">--</dd>
							<dt data-l="dash.sound">Sound</dt><dd id="stream-audio">--</dd>
						</dl>
						<div class="webui-pids" id="stream-pids" aria-label="Packet ids" data-l-aria-label="dash.pids"></div>
					</div>
				</div>
			</section>

			<!-- quick actions -->
			<section class="webui-card" id="card-actions" aria-labelledby="actions-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="actions-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 4 14h7l-1 7 9-11h-7z"/></svg>
						<span data-l="dash.quick">Quick actions</span>
					</h2>
				</header>
				<div class="webui-card-body webui-quick">
					<a title="A picture of what the TV shows" data-l-title="tip.screenshot" href="/extensions/screenshot/index.html" class="webui-btn" data-ext-link="screenshot" hidden>
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a2 2 0 0 1 2-2h1l2-3h8l2 3h1a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3"/></svg>
						<span data-l="dash.screenshot">Screenshot</span>
					</a>
					<a title="The files on the box" data-l-title="tip.files" href="/extensions/files/index.html" class="webui-btn" data-ext-link="files" hidden>
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
						<span data-l="tools.files">Files</span>
					</a>
					<button title="Show a message on the TV" data-l-title="tip.message" type="button" class="webui-btn" onclick="webuiShowMessageDialog()">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
						<span data-l="tools.message">Message</span>
					</button>
					<button title="The remote control in the browser" data-l-title="tip.remote" type="button" class="webui-btn" onclick="webuiShowRemote()">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><circle cx="12" cy="17" r="1"/></svg>
						<span data-l="tools.remote_sub">Remote control</span>
					</button>
					<button title="Put the box into standby" data-l-title="tip.standby" type="button" class="webui-btn" onclick="sendStandby()">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
						<span data-l="dash.standby">Standby</span>
					</button>
				</div>
			</section>

			<!-- the network -->
