<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="wiz.title" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Welcome</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* the card of the sign-in pages (webui.css), with two choices and two ways on */
		.wiz-wrap select {
			margin-bottom: 0;
		}
		.wiz-actions {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			margin-top: 4px;
		}
		.wiz-actions .webui-btn {
			width: 100%;
			padding: 9px 18px;
			font-size: 0.95rem;
		}
		.wiz-wrap .wiz-actions button[type=submit] {
			margin-top: 0;
		}
		.wiz-wrap p.login-first {
			margin-bottom: 0;
		}
		/* the place in the settings it names stays on one line */
		#wizProtectLink {
			white-space: nowrap;
		}
	</style>
</head>
<body class="webui-signin">
	<!-- Shown once a session may write: the page writes startup when it is
	     left by one of its buttons or its link, and not before. -->
	<main class="login-wrap webui-card wiz-wrap" id="wizCard" aria-labelledby="wizTitle" hidden>
		<h1 id="wizTitle" data-l="wiz.welcome">Welcome to the Neutrino-Web-UI</h1>
		<p class="sub" data-l="wiz.intro">Choose your language and start page to get going.</p>

		<form id="wizForm" novalidate>
			<!-- in the DOM up front, so the alert is announced when unhidden -->
			<div class="login-flash err" id="wizErr" role="alert" tabindex="-1" hidden></div>

			<div class="login-field">
				<label for="wizLang" data-l="lang.title">Language</label>
				<select id="wizLang"></select>
			</div>

			<div class="login-field">
				<label for="wizPage" data-l="wiz.start_page">Start page</label>
				<select id="wizPage">
					<option value="dashboard.html" data-l="nav.sub_overview">Dashboard</option>
					<option value="remote.html" data-l="tools.remote_sub">Remote control</option>
					<option value="bouquets.html" data-l="nav.sub_channels">Channels</option>
					<option value="epg.html" data-l="nav.sub_guide">EPG</option>
					<option value="timer.html" data-l="nav.sub_timers">Timers</option>
					<option value="recordings.html" data-l="nav.sub_archive">Recordings</option>
					<option value="tools.html" data-l="nav.sub_boxcontrol">Box control</option>
					<option value="settings.html" data-l="nav.settings">Settings</option>
				</select>
			</div>

			<div class="wiz-actions">
				<button type="submit" class="webui-btn primary" id="wizGo" data-l="wiz.finish">Get started</button>
				<button type="button" class="webui-btn" id="wizSkip" data-l="wiz.skip">Skip</button>
			</div>
		</form>
		<p class="sub login-first" id="wizProtect"><span data-l="wiz.protect">To protect every page with a sign-in, see</span> <a href="/settings.html#nhttpd" id="wizProtectLink" data-l="wiz.protect_link">Settings › Web server</a>.</p>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/wizard.js?v=1"></script>
</body>
</html>
