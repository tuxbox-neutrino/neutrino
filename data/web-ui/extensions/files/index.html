<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="tools.files" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Files</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css">
	<link rel="stylesheet" href="/css/webui.css">
	<style>
		/* Two columns, the folders and the files, with a handle between them
		   (webuiSplitter) that moves the line: wide enough for a whole path
		   if one wants, kept for this browser. One under the other on a phone. */
		main.webui-files-grid {
			display: grid;
			grid-template-columns: var(--fm-side, 240px) 10px minmax(0, 1fr);
			gap: 0.6rem 0.25rem;
			padding: 0.5rem;
			overflow: hidden;
		}

		@media (max-width: 800px) {
			main.webui-files-grid {
				grid-template-columns: 1fr;
				grid-template-rows: auto 1fr;
			}

			main.webui-files-grid > .webui-split-handle {
				display: none;
			}
		}

		/* Compact card headers */

		/* Sidebar card */

		/* Disk usage badge */
		.webui-disk-usage {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			background: var(--pico-card-sectioning-background-color);
			padding: 0.1rem 0.4rem;
			border-radius: 10px;
		}

		/* File list card */

		/* Toolbar (inside card header) */
		.webui-files-toolbar {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			flex-wrap: wrap;
			padding: 0.4rem 0.6rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			background: var(--pico-card-sectioning-background-color);
		}

		.webui-files-toolbar .webui-btn {
			padding: 0.25rem 0.5rem;
		}

		.webui-files-toolbar .webui-btn svg {
			width: 14px;
			height: 14px;
		}

		.webui-toolbar-spacer {
			flex: 1;
		}

		.webui-disk-info {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
		}

		/* Breadcrumb */
		.webui-breadcrumb {
			display: flex;
			align-items: center;
			gap: 0.2rem;
			font-size: var(--webui-font-sm);
			overflow-x: auto;
			white-space: nowrap;
			padding: 0.3rem 0.6rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
		}

		.webui-breadcrumb a {
			color: var(--webui-accent);
			text-decoration: none;
			padding: 0.1rem 0.2rem;
			border-radius: var(--webui-radius);
		}

		.webui-breadcrumb a:hover {
			background: var(--webui-accent-light);
		}

		.webui-breadcrumb-sep {
			color: var(--pico-muted-color);
			font-size: 0.7em;
		}

		.webui-breadcrumb-current {
			color: var(--pico-color);
			font-weight: 500;
		}

		/* File list */

		.webui-file-row {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.4rem 0.8rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			transition: var(--webui-transition);
			cursor: default;
			font-size: var(--webui-font-sm);
		}

		.webui-file-row:last-child {
			border-bottom: none;
		}

		.webui-file-row:hover {
			background: var(--webui-accent-light);
		}

		.webui-file-row.is-dir {
			cursor: pointer;
		}

		/* File icon */
		.webui-file-icon {
			width: 20px;
			height: 20px;
			flex-shrink: 0;
			color: var(--pico-muted-color);
		}

		.webui-file-row.is-dir .webui-file-icon {
			color: var(--webui-accent);
		}

		/* File info */
		.webui-file-info {
			flex: 1;
			min-width: 0;
			display: flex;
			align-items: center;
			gap: 0.6rem;
		}

		/* the shared file control's name has the same class: none of its
		   width, padding or colour here */
		.webui-file-name {
			flex: 1;
			max-width: none;
			padding: 0;
			font-size: inherit;
			color: inherit;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		/* A folder's name is a button that covers its row, so a keyboard
		   opens it as a click on the row does; the row shows the focus */
		.webui-file-row,
		.webui-quick-item {
			position: relative;
		}
		.fm-open {
			all: unset;
			cursor: pointer;
		}
		.fm-open::after {
			content: "";
			position: absolute;
			inset: 0;
		}
		.webui-file-row:focus-within,
		.webui-quick-item:focus-within {
			outline: 2px solid var(--webui-accent);
			outline-offset: -2px;
		}
		.webui-file-actions {
			position: relative;
			z-index: 1;
		}

		/* loading, empty or failed, and a word below the roots */
		.fm-state .webui-state {
			padding: 1.5rem 1rem;
		}
		.fm-note {
			padding: 1rem;
			text-align: center;
			color: var(--pico-muted-color);
			font-size: var(--webui-font-sm);
		}

		/* "choose one" in the drop zone: a button that reads as a link */
		.fm-link {
			--pico-color: inherit;
			all: unset;
			color: var(--webui-accent);
			text-decoration: underline;
			cursor: pointer;
		}

		.fm-link:is(:hover, :focus, :active) {
			/* Pico's button colour on hover, focus and press outweighs the reset above */
			--pico-color: inherit;
		}
		.fm-link:focus-visible {
			outline: 2px solid var(--webui-accent);
			outline-offset: 2px;
		}

		.webui-file-name.editing {
			display: flex;
			gap: 0.3rem;
		}

		.webui-file-name.editing input {
			all: unset;
			box-sizing: border-box;
			flex: 1;
			padding: 0.15rem 0.3rem;
			border: 1px solid var(--webui-accent);
			border-radius: var(--webui-radius);
			font-size: inherit;
			font-family: inherit;
			color: inherit;
			background: var(--pico-card-background-color);
		}

		.webui-file-size {
			width: 70px;
			text-align: right;
			color: var(--pico-muted-color);
			flex-shrink: 0;
			font-size: var(--webui-font-xs);
		}

		.webui-file-date {
			width: 120px;
			color: var(--pico-muted-color);
			flex-shrink: 0;
			font-size: var(--webui-font-xs);
		}

		/* File actions */
		.webui-file-actions {
			display: flex;
			gap: 0.2rem;
			flex-shrink: 0;
			opacity: 0;
			transition: opacity 0.15s ease;
		}

		.webui-file-row:hover .webui-file-actions,
		.webui-file-row:focus-within .webui-file-actions {
			opacity: 1;
		}

		.webui-file-actions .webui-btn {
			padding: 0.2rem 0.3rem;
		}

		.webui-file-actions .webui-btn svg {
			width: 13px;
			height: 13px;
		}

		/* Parent dir row */
		.webui-file-row.parent-dir {
			color: var(--pico-muted-color);
			font-weight: 500;
		}

		.webui-file-row.parent-dir .webui-file-icon {
			color: var(--pico-muted-color);
		}

		/* Upload area */
		.webui-upload-area {
			display: none;
			padding: 0.8rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			background: var(--pico-card-sectioning-background-color);
		}

		.webui-upload-area.active {
			display: block;
		}

		.webui-upload-dropzone {
			border: 2px dashed var(--pico-muted-border-color);
			border-radius: var(--webui-radius-lg);
			padding: 1.5rem;
			text-align: center;
			color: var(--pico-muted-color);
			transition: var(--webui-transition);
		}

		.webui-upload-dropzone.dragover {
			border-color: var(--webui-accent);
			background: var(--webui-accent-light);
			color: var(--webui-accent);
		}

		.webui-upload-progress {
			margin-top: 0.5rem;
			display: none;
		}

		.webui-upload-progress.active {
			display: block;
		}

		.webui-upload-progress progress {
			width: 100%;
			height: 4px;
		}

		/* New folder input in toolbar */
		#newFolderRow {
			display: none;
			padding: 0.4rem 0.6rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			background: var(--pico-card-sectioning-background-color);
		}

		#newFolderRow.active {
			display: flex;
			align-items: center;
			gap: 0.4rem;
		}

		#newFolderRow input {
			all: unset;
			box-sizing: border-box;
			flex: 1;
			padding: 0.3rem 0.5rem;
			border: 1px solid var(--webui-accent);
			border-radius: var(--webui-radius);
			font-size: var(--webui-font-sm);
			font-family: inherit;
			color: inherit;
			background: var(--pico-card-background-color);
		}

		/* Mobile Accordion */
		@media (max-width: 800px) {
			.webui-files-grid {
				display: flex;
				flex-direction: column;
				gap: 0.4rem;
				overflow: auto;
			}

			.webui-card-indicator {
				display: flex;
			}

			.webui-sidebar-card,
			.webui-filelist-card {
				flex: none;
				max-height: none;
				min-height: auto;
			}

			.webui-sidebar-card .webui-card-header,
			.webui-filelist-card .webui-card-header {
				cursor: pointer;
				position: relative;
				padding-right: 2rem;
			}

			.webui-sidebar-card .webui-card-title,
			.webui-filelist-card .webui-card-title {
				font-size: 0.9rem;
			}

			.webui-card.collapsed .webui-card-preview {
				display: inline-block;
			}

			/* Chevron indicator */
			.webui-sidebar-card .webui-card-header::after,
			.webui-filelist-card .webui-card-header::after {
				content: '\25BC';
				position: absolute;
				right: 0.5rem;
				top: 50%;
				transform: translateY(-50%);
				font-size: 0.55rem;
				color: var(--pico-muted-color);
				transition: transform 0.2s ease;
				pointer-events: none;
			}

			.webui-card:not(.collapsed) .webui-card-header::after {
				transform: translateY(-50%) rotate(180deg);
			}

			.webui-sidebar-card .webui-card-body,
			.webui-filelist-card .webui-card-body {
				display: block;
				max-height: 60dvh;
				overflow-y: auto;
			}

			.webui-card.collapsed .webui-card-body,
			.webui-card.collapsed .webui-files-toolbar,
			.webui-card.collapsed .webui-breadcrumb,
			.webui-card.collapsed .webui-upload-area,
			.webui-card.collapsed #newFolderRow {
				display: none;
			}

			/* File actions always visible on mobile */
			.webui-file-actions {
				opacity: 1;
			}

			.webui-file-row {
				padding: 0.5rem 0.6rem;
			}

			/* Hide date on mobile */
			.webui-file-date {
				display: none;
			}
		}

		[data-theme="light"] .webui-file-row {
			border-bottom-color: #e5e7eb;
		}

		[data-theme="light"] .webui-file-row:hover {
			background: #f8f9fa;
		}

	</style>
</head>
<body>
	<div class="webui-header-wrapper" data-page="ext-files"></div>
	<div class="webui-header-spacer"></div>

	<!-- Main Content: 2-Column Grid -->
	<main class="webui-files-grid">
		<!-- Sidebar Card -->
		<article class="webui-card webui-panel-card webui-card-sm webui-sidebar-card" id="card-sidebar">
			<header class="webui-card-header" onclick="toggleCard('card-sidebar')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
					</svg>
					<span data-l="fm.dirs">Directories</span>
				</h3>
				<span class="webui-card-preview" id="sidebarPreview">--</span>
			</header>
			<div class="webui-card-body">
				<ul class="webui-plain-list webui-quick-list" id="quickList"></ul>
			</div>
		</article>

		<div class="webui-split-handle" id="fmSplit" aria-label="Width of the folder list" data-l-aria-label="fm.split" title="Drag to widen or narrow the folder list" data-l-title="fm.split_title"></div>

		<!-- File List Card -->
		<article class="webui-card webui-panel-card webui-card-sm webui-filelist-card" id="card-files">
			<header class="webui-card-header" onclick="toggleCard('card-files')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
						<polyline points="14,2 14,8 20,8"/>
					</svg>
					<span id="fileListTitle" data-l="tools.files">Files</span>
				</h3>
				<span class="webui-card-preview" id="filesPreview">--</span>
			</header>

			<!-- Breadcrumb -->
			<nav class="webui-breadcrumb" id="breadcrumb"></nav>

			<!-- Toolbar -->
			<div class="webui-files-toolbar">
				<button type="button" class="webui-btn" onclick="showNewFolderInput()" title="New folder" data-l-title="fm.new_folder">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
						<line x1="12" y1="11" x2="12" y2="17"/>
						<line x1="9" y1="14" x2="15" y2="14"/>
					</svg>
					<span class="btn-label" data-l="fm.folder">Folder</span>
				</button>
				<button type="button" class="webui-btn" onclick="toggleUpload()" title="Upload" data-l-title="fm.upload">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
						<polyline points="17,8 12,3 7,8"/>
						<line x1="12" y1="3" x2="12" y2="15"/>
					</svg>
					<span class="btn-label" data-l="fm.upload">Upload</span>
				</button>
				<button type="button" class="webui-btn" onclick="refreshDir()" title="Refresh" data-l-title="si.refresh" aria-label="Refresh" data-l-aria-label="si.refresh">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<polyline points="23,4 23,10 17,10"/>
						<path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
					</svg>
				</button>
				<span class="webui-toolbar-spacer"></span>
				<span class="webui-disk-info" id="diskInfo"></span>
			</div>

			<!-- New folder input -->
			<div id="newFolderRow">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;color:var(--webui-accent);flex-shrink:0">
					<path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
				</svg>
				<input type="text" id="newFolderName" placeholder="Folder name..." data-l-placeholder="fm.folder_name" aria-label="Folder name" data-l-aria-label="fm.folder_name_label" onkeydown="handleNewFolderKey(event)">
				<button type="button" class="webui-btn primary" onclick="createFolder()" style="padding:0.25rem 0.5rem" aria-label="Create" data-l-aria-label="fm.create">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
						<polyline points="20,6 9,17 4,12"/>
					</svg>
				</button>
				<button type="button" class="webui-btn" onclick="hideNewFolderInput()" style="padding:0.25rem 0.5rem" aria-label="Cancel" data-l-aria-label="msg.cancel">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
						<line x1="18" y1="6" x2="6" y2="18"/>
						<line x1="6" y1="6" x2="18" y2="18"/>
					</svg>
				</button>
			</div>

			<!-- Upload area -->
			<div class="webui-upload-area" id="uploadArea">
				<div class="webui-upload-dropzone" id="dropzone">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:32px;height:32px;margin-bottom:0.5rem">
						<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
						<polyline points="17,8 12,3 7,8"/>
						<line x1="12" y1="3" x2="12" y2="15"/>
					</svg>
					<div><span data-l="fm.drop_here">Drop a file here or</span> <button type="button" class="fm-link" onclick="document.getElementById('fileInput').click()" data-l="fm.choose">choose one</button></div>
					<input type="file" id="fileInput" style="display:none" onchange="uploadFile(this.files[0])">
				</div>
				<div class="webui-upload-progress" id="uploadProgress">
					<progress id="uploadBar" value="0" max="100" aria-label="Upload" data-l-aria-label="fm.upload"></progress>
					<div style="font-size:var(--webui-font-xs);color:var(--pico-muted-color);margin-top:0.3rem" id="uploadStatus" role="status"></div>
				</div>
			</div>

			<!-- File list -->
			<div class="webui-card-body">
				<ul class="webui-plain-list webui-file-list" id="fileList">
					<li class="fm-note" aria-busy="true" data-l="msg.loading">Loading...</li>
				</ul>
			</div>
		</article>

		<!-- Mobile Card Indicator -->
		<div class="webui-card-indicator" id="cardIndicator"></div>
	</main>

	<script src="/js/webui-i18n.js"></script>
	<script src="/js/webui-header.js"></script>
	<script src="/js/webui-dom.js"></script>
	<script src="/js/webui-v1.js"></script>
	<script src="files.js"></script>
</body>
</html>
