<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="manifest.name" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - LCD4Linux</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<link rel="manifest" href="webapp.json">
	<meta name="theme-color" content="#212121">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css">
	<link rel="stylesheet" href="/css/webui.css">
	<style>
		/* A page of the interface: the head and its way back, the picture
		   of the front display in a card on the dark of the display. Full
		   screen (for a tablet beside the box) shows the picture alone,
		   Escape or the button leaves it again. */
		.lcd-wrap {
			padding: 1rem;
		}

		.lcd-card .webui-card-header {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: space-between;
			gap: 0.5rem;
		}

		.lcd-acts {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.5rem;
		}

		/* the repeat, as the screenshot window has it: a switch, the number
		   of seconds in a field without a frame of its own, and its unit */
		.lcd-repeat {
			display: flex;
			align-items: center;
			gap: 0.3rem;
			padding: 0 0.6rem 0 0.1rem;
			border-radius: 999px;
			background: var(--webui-bg-elevated);
			font-size: var(--webui-font-sm);
		}

		.lcd-repeat input[type="number"] {
			width: 3.2em;
			margin: 0;
			padding: 0.15rem 0.2rem;
			border: 0;
			background: none;
			color: inherit;
			font-size: inherit;
			text-align: center;
			-moz-appearance: textfield;
		}

		.lcd-repeat input[type="number"]::-webkit-inner-spin-button,
		.lcd-repeat input[type="number"]::-webkit-outer-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		.lcd-repeat input[type="number"]:disabled {
			color: var(--pico-muted-color);
		}

		.lcd-repeat input[type="number"]:focus-visible {
			outline: 2px solid var(--webui-focus-color);
			outline-offset: 1px;
			border-radius: 4px;
			box-shadow: none;
		}

		.lcd-stage {
			display: grid;
			place-items: center;
			min-height: min(60vh, 480px);
			padding: 1rem;
			background: #212121;
			color: #bdbdbd;
		}

		.lcd-stage img {
			display: block;
			max-width: 100%;
			max-height: calc(100vh - 220px);
		}

		.lcd-stage:fullscreen {
			min-height: 100vh;
			padding: 0;
		}

		.lcd-stage:fullscreen img {
			max-width: 100vw;
			max-height: 100vh;
		}

		/* the button out of full screen, on the picture's dark */
		.lcd-leave {
			display: none;
			position: fixed;
			top: 0.75rem;
			right: 0.75rem;
		}

		.lcd-stage:fullscreen .lcd-leave {
			display: inline-flex;
		}

		/* no Pico on the picture's text: hidden has to win over a display of its own */
		.lcd-stage [hidden] {
			display: none !important;
		}
	</style>
</head>
<body>
	<div class="webui-header-wrapper" data-page="ext-lcd4linux"></div>
	<div class="webui-header-spacer"></div>

	<main class="lcd-wrap">
		<article class="webui-card lcd-card">
			<header class="webui-card-header">
				<h3 class="webui-card-title" data-l="manifest.name">LCD4Linux</h3>
				<div class="lcd-acts">
					<div class="lcd-repeat">
						<label class="webui-toggle-field" title="Fetch a new picture every few seconds" data-l-title="lcd.tip_repeat">
							<span class="webui-toggle">
								<input type="checkbox" id="lcd-repeat" checked>
								<span class="webui-toggle-slider"></span>
							</span>
							<span class="webui-toggle-text" data-l="lcd.repeat">Repeat every</span>
						</label>
						<input type="number" id="lcd-every" value="15" min="1" max="180" aria-label="Seconds between two pictures" data-l-aria-label="lcd.seconds">
						<span aria-hidden="true">s</span>
					</div>
					<button type="button" class="webui-btn" id="lcd-full" onclick="lcdFullscreen(true)" title="The picture alone, full screen" data-l-title="lcd.full_title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
						</svg>
						<span data-l="lcd.full">Full screen</span>
					</button>
				</div>
			</header>
			<div class="lcd-stage" id="lcd-stage">
				<img id="lcd-picture" alt="The front display as LCD4Linux draws it" hidden>
				<div id="lcd-off" role="status" hidden>LCD4Linux is not drawing on this box.</div>
				<button type="button" class="webui-btn lcd-leave" onclick="lcdFullscreen(false)" data-l="lcd.leave">Leave full screen</button>
			</div>
		</article>
	</main>

	<script src="/js/webui-i18n.js"></script>
	<script src="/js/webui-header.js"></script>
	<script src="/js/webui-v1.js"></script>
	<script src="lcd4linux.js"></script>
</body>
</html>
