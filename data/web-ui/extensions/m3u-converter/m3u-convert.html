<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Neutrino-Web-UI - m3u Converter</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css">
	<link rel="stylesheet" href="/css/webui.css">
	<style>
		.m3u-wrap { max-width: 920px; margin: 0 auto; padding: 1rem; }
		.m3u-wrap textarea { width: 100%; font-family: monospace; font-size: 0.8rem; }
		.m3u-intro { color: var(--pico-muted-color); font-size: 0.85rem; }
		.m3u-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.6rem; }
		.m3u-meta label { display: flex; flex-direction: column; font-size: 0.8rem; gap: 0.2rem; }
		.m3u-meta input { margin-bottom: 0; }
		.m3u-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin: 0.8rem 0; }
		.m3u-check { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; margin: 0; }
		.m3u-check input { margin: 0; }
	</style>
</head>
<body>
	<div class="webui-header-wrapper" data-page="ext-m3u-converter"></div>
	<div class="webui-header-spacer"></div>

	<main class="m3u-wrap">
		<article class="webui-card webui-card-sm">
			<header class="webui-card-header">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>
					</svg>
					m3u &rarr; WebTV-XML
				</h3>
			</header>
			<div class="webui-card-body">
				<p class="m3u-intro">
					<span data-l="m3u.intro1">Converts m3u playlists (EXTINF) into the format of</span> <code>webtv_usr.xml</code>.
					<span data-l="m3u.intro2">Saved on the box, it can join the WebTV sources right away.</span></p>

				<div class="webui-form-section-title"><span data-l="m3u.step1_nr">1. Paste streams</span></div>
				<textarea id="m3uInput" rows="9" placeholder="#EXTM3U&#10;#EXTINF:0,DE:Beispiel&#10;http://server:8000/live/377.ts"></textarea>
				<div class="m3u-actions">
					<label class="webui-file">
						<input type="file" id="m3uFile" accept=".m3u,.m3u8,.txt" multiple onchange="m3uFiles(this)">
						<span class="webui-file-btn" data-l="m3u.load_file">Load m3u file</span>
						<span class="webui-file-name">&ndash;</span>
					</label>
				</div>

				<div class="webui-form-section-title"><span data-l="m3u.step2_nr">2. Metadata</span></div>
				<div class="m3u-meta">
					<label><span data-l="m3u.title">Title</span> <input id="m3uTitle" value="my streams"></label>
					<label><span data-l="m3u.desc">Description</span> <input id="m3uDesc" value="webtv"></label>
					<label>Genre <input id="m3uGenre" value="Movie"></label>
					<label><span data-l="m3u.filename">File name</span> <input id="m3uName" value="webtv_usr.xml"></label>
				</div>

				<div class="m3u-actions">
					<button type="button" class="webui-btn primary" onclick="m3uConvert()">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>
						</svg>
						<span data-l="m3u.convert">Convert</span></button>
					<button type="button" class="webui-btn" onclick="m3uDownload()">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
						</svg>
						<span data-l="m3u.download">Download as file</span></button>
					<button type="button" class="webui-btn" onclick="m3uSaveToBox(this)">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/>
						</svg>
						<span data-l="m3u.save_box">Save on the box</span></button>
					<label class="m3u-check"><input type="checkbox" id="m3uAddSource" checked>
						<span data-l="m3u.add_to_sources">and add it to the WebTV sources</span></label>
				</div>

				<div class="webui-form-section-title"><span data-l="m3u.step3_nr">3. Result</span></div>
				<textarea id="m3uOutput" rows="10" placeholder="(webtv_usr.xml appears here)" data-l-placeholder="m3u.out_ph"></textarea>
			</div>
		</article>
	</main>

	<script src="/js/webui-i18n.js"></script>
	<script src="/js/webui-header.js"></script>
	<script src="/js/webui-dom.js"></script>
	<script src="/js/webui-v1.js"></script>
	<script src="m3u-convert.js"></script>
</body>
</html>
