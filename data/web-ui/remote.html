<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="tools.remote_sub" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Remote control</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=1">
	<style>
	/* The remote control as a page of its own, to open the interface with
	   on a phone: the panel the dashboard opens in a window, here in the
	   middle of the page, the toggle of its full-screen view above its
	   right corner. */
	.webui-remote-page {
		max-width: 360px;
		margin: 0 auto;
		padding: 0.75rem 1rem 1.5rem;
	}

	.webui-remote-page-bar {
		display: flex;
		justify-content: flex-end;
	}

	/* the full-screen view: over the head and the side bar, the toggle in
	   the top right corner, the remote in the middle of what is left and
	   scrolled where the screen is lower than it */
	.webui-remote-page.webui-remote-full {
		position: fixed;
		inset: 0;
		z-index: 1100;
		display: flex;
		flex-direction: column;
		max-width: none;
		margin: 0;
		padding: max(0.5rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
		overflow-y: auto;
		overscroll-behavior: contain;
		background: var(--pico-background-color);
	}

	.webui-remote-page.webui-remote-full #remoteHost {
		display: flex;
		flex: 1 0 auto;
		flex-direction: column;
		justify-content: center;
		justify-content: safe center;
	}
	</style>
</head>
<body>
	<div class="webui-header-wrapper" data-page="remote"></div>
	<div class="webui-header-spacer"></div>

	<main>
		<div class="webui-remote-page webui-remote-full-root" id="remotePage">
			<div class="webui-remote-page-bar" id="remoteBar"></div>
			<div id="remoteHost"></div>
		</div>
	</main>

	<script src="/js/webui-i18n.js?v=1"></script>
	<script src="/js/webui-header.js?v=1"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=1"></script>
	<script src="/js/remote.js?v=1"></script>
</body>
</html>
