<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.sub_boxcontrol" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Box control</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
	/* The box control (Phase 4): its parts as cards side by side, shared out
	   evenly over the rows as the dashboard's cards are (webuiBalanceGrid),
	   the cards of a row as high as each other; two to a row on a narrow
	   screen, one under the other on a phone. Each row of a card says what
	   it does and holds its buttons. */
	.webui-boxcontrol {
		display: grid;
		grid-template-columns: repeat(60, minmax(0, 1fr));
		/* the space between the cards as their margin: 59 gaps between the
		   columns would hold the grid at 944 px at least */
		column-gap: 0;
		row-gap: 1rem;
		align-items: stretch;
		max-width: var(--webui-page-max);
		margin: 0 auto;
		padding: 1rem 0.5rem;
	}

	.webui-boxcontrol > .webui-card {
		grid-column: span var(--dash-span, 20);
		margin-inline: 0.5rem;
	}

	/* two to a row until the balancer has shared the cards out, which it
	   does down to a phone's width */
	@media (max-width: 1100px) {
		.webui-boxcontrol > .webui-card {
			grid-column: span var(--dash-span, 30);
		}
	}

	@media (max-width: 760px) {
		.webui-boxcontrol > .webui-card {
			grid-column: span 60;
		}
	}

	.webui-boxcontrol .webui-card-body {
		display: grid;
		align-content: start;
		gap: 0.25rem;
		padding: 0.5rem 1rem 0.75rem;
	}

	.webui-bc-row {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem 1rem;
		align-items: center;
		justify-content: space-between;
		padding: 0.45rem 0;
		border-top: 1px solid var(--pico-muted-border-color);
	}

	.webui-bc-row:first-child {
		border-top: 0;
	}

	/* the name of a row, a plain text or the label of its field, in one size */
	.webui-bc-row > :first-child {
		margin: 0;
		font-size: var(--webui-font-sm);
	}

	.webui-bc-row small {
		display: block;
		color: var(--pico-muted-color);
	}

	.webui-bc-acts {
		display: flex;
		flex-wrap: wrap;
		gap: 0.4rem;
	}

	.webui-bc-acts .webui-btn,
	.webui-bc-acts select {
		margin: 0;
	}

	.webui-bc-acts .webui-btn svg {
		width: 0.9rem;
		height: 0.9rem;
	}

	.webui-bc-acts select {
		width: auto;
		padding-top: 0.3rem;
		padding-bottom: 0.3rem;
		font-size: var(--webui-font-sm);
	}

	.webui-boxcontrol .webui-card-title .webui-pill {
		margin-left: 0.4rem;
	}

	/* the window that waits for the box to come back */
	.webui-bc-wait .webui-state {
		padding: 1rem 0.5rem 0.5rem;
	}
	</style>
</head>
<body>
	<div class="webui-header-wrapper" data-page="tools"></div>
	<div class="webui-header-spacer"></div>

	<main>
		<div class="webui-boxcontrol">
			<section class="webui-card" aria-labelledby="bc-box-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="bc-box-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
						<span data-l="dash.box">Box</span>
					</h2>
				</header>
				<div class="webui-card-body">
					<div class="webui-bc-row">
						<span data-l="bc.restart_gui">Restart Neutrino GUI</span>
						<span class="webui-bc-acts"><button title="Restart only the Neutrino interface; the box keeps running" data-l-title="tip.restart_gui" type="button" class="webui-btn" onclick="bcRestart('gui')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg><span data-l="bc.restart_btn">Restart GUI</span></button></span>
					</div>
					<div class="webui-bc-row">
						<span data-l="bc.reboot">Reboot the box</span>
						<span class="webui-bc-acts"><button title="Restart the whole box" data-l-title="tip.reboot" type="button" class="webui-btn danger" onclick="bcRestart('box')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg><span data-l="bc.reboot_btn">Reboot</span></button></span>
					</div>
					<div class="webui-bc-row">
						<span data-l="bc.shutdown">Power off the box</span>
						<span class="webui-bc-acts"><button title="Switch the box off (deep standby)" data-l-title="tip.power_off" type="button" class="webui-btn danger" onclick="bcRestart('off')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/><path d="M12 2v10"/></svg><span data-l="bc.shutdown_btn">Power off</span></button></span>
					</div>
				</div>
			</section>

			<section class="webui-card" aria-labelledby="bc-rec-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="bc-rec-title">
						<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
						<span data-l="bc.recording">Recording</span>
						<span class="webui-pill" id="bcRecState" hidden></span>
					</h2>
				</header>
				<div class="webui-card-body">
					<div class="webui-bc-row">
						<span><span data-l="bc.instant_rec">Instant recording</span><small data-l="bc.instant_hint">Of the channel the box shows</small></span>
						<span class="webui-bc-acts">
							<button title="Record the channel the box shows now" data-l-title="tip.rec_start" type="button" class="webui-btn webui-record-btn" onclick="bcRecStart()"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg><span data-l="bc.rec_start">Start</span></button>
							<button title="Stop the recording running now" data-l-title="tip.rec_stop" type="button" class="webui-btn" onclick="bcRecStop()"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg><span data-l="bc.rec_stop">Stop</span></button>
						</span>
					</div>
				</div>
			</section>

			<section class="webui-card" id="bcVideo" aria-labelledby="bc-video-title" hidden>
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="bc-video-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
						<span data-l="bc.video">Picture</span>
					</h2>
				</header>
				<div class="webui-card-body">
					<div class="webui-bc-row">
						<label for="bcVideoMode" data-l="bc.resolution">Resolution</label>
						<span class="webui-bc-acts">
							<select title="Resolution of the TV output" data-l-title="tip.video_mode" id="bcVideoMode"></select>
							<button title="Set the resolution chosen" data-l-title="tip.video_apply" type="button" class="webui-btn" onclick="bcVideoApply()" data-l="bqe.apply">Apply</button>
						</span>
					</div>
				</div>
			</section>

			<section class="webui-card" aria-labelledby="bc-rc-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="bc-rc-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><circle cx="12" cy="17" r="1"/></svg>
						<span data-l="tools.remote_sub">Remote control</span>
					</h2>
				</header>
				<div class="webui-card-body">
					<div class="webui-bc-row">
						<span data-l="bc.rc_at_box">RC at the box</span>
						<span class="webui-bc-acts">
							<button title="Lock the remote control at the box" data-l-title="tip.rc_lock" type="button" class="webui-btn" onclick="bcAction('bc.lock', 'PUT /osd/remote', {locked: true})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span data-l="bc.lock">Lock</span></button>
							<button title="Unlock the remote control at the box" data-l-title="tip.rc_unlock" type="button" class="webui-btn" onclick="bcAction('bc.unlock', 'PUT /osd/remote', {locked: false})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg><span data-l="bc.unlock">Unlock</span></button>
						</span>
					</div>
					<div class="webui-bc-row">
						<span data-l="bc.web_rc">Remote control in the browser</span>
						<span class="webui-bc-acts"><button title="The remote control in the browser" data-l-title="tip.remote" type="button" class="webui-btn" onclick="webuiShowRemote()" data-l="bc.web_rc_open">Open</button></span>
					</div>
				</div>
			</section>

			<section class="webui-card" aria-labelledby="bc-zapit-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="bc-zapit-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
						<span data-l="bc.zapit">Channels and tuner</span>
					</h2>
				</header>
				<div class="webui-card-body">
					<div class="webui-bc-row">
						<span data-l="bc.reload_channels">Reload channel lists</span>
						<span class="webui-bc-acts"><button title="Read the box's channel lists again" data-l-title="tip.reload_channels" type="button" class="webui-btn" onclick="bcAction('bc.reload_channels', 'POST /channels/reload', null)" data-l="bc.reload">Reload</button></span>
					</div>
					<div class="webui-bc-row">
						<span data-l="bc.tuner_reset">Tuner reset</span>
						<span class="webui-bc-acts"><button title="Reset the tuners; the picture is gone for a moment" data-l-title="tip.tuner_reset" type="button" class="webui-btn" onclick="bcAction('bc.tuner_reset', 'POST /tuner/reset', null)" data-l="bc.reset">Reset</button></span>
					</div>
				</div>
			</section>
		</div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/tools.js?v=2"></script>
</body>
</html>
