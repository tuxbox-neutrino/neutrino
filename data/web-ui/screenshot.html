<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Neutrino-Web-UI - Screenshot</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { document.documentElement.setAttribute('data-theme', localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme') || 'dark'); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* 2-column grid: Remote (auto) + Screenshot (flex) */
		.webui-screenshot-grid {
			display: grid;
			grid-template-columns: auto 1fr;
			grid-template-rows: minmax(0, 1fr);
			gap: 0.5rem;
			padding: 0.5rem;
			max-width: 1400px;
			margin: 0 auto;
			height: calc(100dvh - 5rem);
		}

		/* Screenshot card fills available space */
		.webui-screenshot-grid #card-screenshot {
			display: flex;
			flex-direction: column;
			min-height: 0;
		}

		/* ── Toolbar ── */
		.webui-screenshot-toolbar {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
			align-items: center;
		}

		.webui-screenshot-actions {
			display: flex;
			gap: 0.4rem;
		}

		.webui-screenshot-options {
			display: flex;
			gap: 1rem;
			align-items: center;
			margin-left: auto;
		}

		/* Toggle switch + label now use the shared .webui-toggle /
		   .webui-toggle-slider / .webui-toggle-field from webui.css. */

		/* ── Reload group (same pill style as toggles) ── */
		.webui-reload-group {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-left: auto;
			padding: 0.3rem 0.5rem;
			border-radius: 999px;
			font-size: var(--webui-font-sm);
		}

		[data-theme="dark"] .webui-reload-group { background: rgba(255,255,255,0.06); }
		html:not([data-theme="dark"]) .webui-reload-group { background: rgba(0,0,0,0.05); }

		.webui-reload-group .webui-toggle-field {
			background: none;
			padding: 0;
		}

		/* Borderless inline input */
		.webui-reload-group input[type="number"] {
			all: unset;
			box-sizing: border-box;
			width: 2ch;
			font-size: inherit;
			font-family: inherit;
			color: inherit;
			text-align: center;
			-moz-appearance: textfield;
			opacity: 0.7;
		}

		.webui-reload-group input[type="number"]:disabled { opacity: 0.3; }

		.webui-reload-group input[type="number"]:focus { opacity: 1; }

		.webui-reload-group input[type="number"]::-webkit-inner-spin-button,
		.webui-reload-group input[type="number"]::-webkit-outer-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		.webui-reload-group .webui-unit {
			font-size: inherit;
			opacity: 0.5;
		}

		/* ── Screenshot display area ── */
		.webui-screenshot-display {
			position: relative;
			flex: 1;
			min-height: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0.5rem;
			background: var(--pico-card-sectioning-background-color);
			border-radius: 0 0 var(--webui-radius-lg) var(--webui-radius-lg);
		}

		.webui-screenshot-display img {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
			display: block;
		}

		.webui-screenshot-placeholder {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1rem;
			color: var(--pico-muted-color);
		}

		.webui-screenshot-placeholder svg {
			width: 64px;
			height: 64px;
			opacity: 0.5;
		}

		/* ── Remote card ── */
		.webui-screenshot-grid #card-remote {
			display: flex;
			flex-direction: column;
			min-height: 0;
		}

		.webui-screenshot-grid #card-remote .webui-card-body {
			flex: 1;
			min-height: 0;
			/* Scroll instead of clipping when the numpad is opened and
			   the remote outgrows the card */
			overflow-y: auto;
			overflow-x: hidden;
		}

		/* ── Mobile: single column + accordion ── */
		@media (max-width: 768px) {
			.webui-screenshot-grid {
				grid-template-columns: 1fr;
				grid-template-rows: auto auto;
				height: auto;
				gap: 0.4rem;
			}

			/* Accordion header */
			.webui-screenshot-grid .webui-card-header {
				cursor: pointer;
				position: relative;
				padding-right: 2rem;
			}

			.webui-screenshot-grid .webui-card-header::after {
				content: '\25BC';
				position: absolute;
				right: 0.5rem;
				top: 50%;
				transform: translateY(-50%);
				font-size: 0.55rem;
				color: var(--pico-muted-color);
				transition: transform 0.2s ease;
				pointer-events: none;
			}

			.webui-screenshot-grid .webui-card.expanded .webui-card-header::after {
				transform: translateY(-50%) rotate(180deg);
			}

			/* Hide body + display when collapsed */
			.webui-screenshot-grid .webui-card:not(.expanded) .webui-card-body,
			.webui-screenshot-grid .webui-card:not(.expanded) .webui-screenshot-display {
				display: none;
			}

			/* Screenshot display on mobile */
			.webui-screenshot-display {
				min-height: 200px;
			}

			/* Toolbar: vertical stack on mobile */
			.webui-screenshot-toolbar {
				flex-direction: column;
				gap: 1rem;
			}

			/* Buttons: full width, larger touch targets */
			.webui-screenshot-actions {
				width: 100%;
				gap: 0.6rem;
			}

			.webui-screenshot-actions .webui-btn {
				flex: 1;
				padding: 0.7rem 0.75rem;
				font-size: var(--webui-font-base);
			}

			.webui-screenshot-actions .webui-btn svg {
				width: 20px;
				height: 20px;
			}

			.webui-screenshot-actions .webui-btn .btn-label {
				display: inline;
			}

			/* Options: 2x2 grid on mobile */
			.webui-screenshot-options {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 0.75rem 1rem;
				align-items: center;
				width: 100%;
				margin-left: 0;
			}

			/* Reload group: second row */
			.webui-reload-group {
				grid-column: 1 / -1;
				margin-left: 0;
				justify-self: start;
				padding: 0.4rem 0.75rem;
				font-size: var(--webui-font-base);
			}

			/* Touch: the field padding provides the target size, the
			   switch keeps the shared 36x20 geometry */
			.webui-toggle-field {
				font-size: var(--webui-font-base);
				gap: 0.5rem;
				padding: 0.4rem 0.75rem;
			}

			.webui-reload-group input[type="number"] {
				width: 2.5ch;
			}

			/* Remote card: natural height on mobile */
			.webui-screenshot-grid #card-remote {
				min-height: auto;
				overflow: visible;
			}

			.webui-screenshot-grid #card-remote .webui-card-body {
				flex: none;
				overflow: visible;
			}
		}
	</style>
</head>
<body>
	<!-- Header wird dynamisch von webui-header.js generiert -->
	<div class="webui-header-wrapper" data-page="tools"></div>
	<div class="webui-header-spacer"></div>

	<!-- Main Content -->
	<main class="webui-screenshot-grid">
		<!-- Remote Card (left) -->
		<article class="webui-card" id="card-remote">
			<header class="webui-card-header" onclick="toggleCard('card-remote')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<rect x="7" y="2" width="10" height="20" rx="2"/>
						<circle cx="12" cy="18" r="1"/>
					</svg>
					<span data-l="tools.remote_sub">Remote control</span>
				</h3>
			</header>
			<div class="webui-card-body" id="remoteContainer"></div>
		</article>

		<!-- Screenshot Card (right) -->
		<article class="webui-card" id="card-screenshot">
			<header class="webui-card-header" onclick="toggleCard('card-screenshot')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
						<circle cx="12" cy="13" r="4"/>
					</svg>
					Screenshot
				</h3>
			</header>
			<div class="webui-card-body">
				<div class="webui-screenshot-toolbar">
					<div class="webui-screenshot-actions">
						<button class="webui-btn primary" onclick="doSnapshot()" id="btnSnapshot">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
								<circle cx="12" cy="13" r="4"/>
							</svg>
							<span class="btn-label">Screenshot</span>
						</button>
						<button class="webui-btn" onclick="doClear()">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<polyline points="3,6 5,6 21,6"/>
								<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
							</svg>
							<span class="btn-label" data-l="shot.clear">Clear</span>
						</button>
						<button class="webui-btn" onclick="doGlcdSnapshot(this)" id="btnGlcd" style="display:none">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<rect x="2" y="7" width="20" height="10" rx="2"/>
							</svg>
							<span class="btn-label">GLCD</span>
						</button>
					</div>

					<div class="webui-screenshot-options">
						<label class="webui-toggle-field">
							<span class="webui-toggle">
								<input type="checkbox" id="checkOSD" checked>
								<span class="webui-toggle-slider"></span>
							</span>
							<span class="webui-toggle-text">OSD</span>
						</label>
						<label class="webui-toggle-field">
							<span class="webui-toggle">
								<input type="checkbox" id="checkVideo" checked>
								<span class="webui-toggle-slider"></span>
							</span>
							<span class="webui-toggle-text">Video</span>
						</label>
						<div class="webui-reload-group">
							<label class="webui-toggle-field">
								<span class="webui-toggle">
									<input type="checkbox" id="checkReload">
									<span class="webui-toggle-slider"></span>
								</span>
								<span class="webui-toggle-text">Reload</span>
							</label>
							<input type="number" id="inputReload" value="15" min="1" max="180" disabled>
							<span class="webui-unit">s</span>
						</div>
					</div>
				</div>
			</div>

			<div class="webui-screenshot-display" id="screenshotDisplay">
				<div class="webui-screenshot-placeholder" id="placeholder">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
						<circle cx="8.5" cy="8.5" r="1.5"/>
						<polyline points="21,15 16,10 5,21"/>
					</svg>
					<span data-l="shot.hint">Click Screenshot to capture an image</span>
				</div>
				<p id="loading" aria-busy="true" style="display:none;padding:2rem;text-align:center;color:var(--pico-muted-color)" data-l="shot.busy">Taking screenshot...</p>
				<img id="screenshot" src="" alt="Screenshot" style="display:none">
			</div>
		</article>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=62"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script>
		let reloadInterval = null;
		let shotUrl = null;		// object URL of the picture shown, freed when replaced
		let shotBusy = false;		// one capture at a time: the box refuses a second one
		let displayProbe = null;	// 'shown', 'none', or 'signin' while a sign-in is missing

		// Inject shared remote template; registering via the host keeps
		// this instance replaceable by a late-loaded skin renderer
		webuiAfterTexts(function() {
			webuiRenderRemote('remoteContainer', {
				onKey: 'rcsim',
				id: 'screenshotRemote'
			});

			// Mobile accordion (shared)
			webuiInitMobileAccordion({
				cardOrder: ['card-remote', 'card-screenshot'],
				storageKey: 'webui-screenshot-card',
				defaultCard: 'card-screenshot',
				breakpoint: 768,
				containerSelector: '.webui-screenshot-grid',
				mode: 'expanded'
			});
		});

		// Remote Control Simulation (key press + optional auto-screenshot)
		async function rcsim(key) {
			if (!checkEnable()) return;
			try {
				await webuiSendKey(key);
				if (document.getElementById('checkReload').checked) {
					setTimeout(doSnapshot, 750);
				}
			} catch (e) {
				console.error('RC command failed:', e);
			}
		}

		// Screenshot functions
		function checkEnable() {
			const osd = document.getElementById('checkOSD').checked;
			const video = document.getElementById('checkVideo').checked;

			if (!osd && !video) {
				webuiShowToast(webuiL('shot.select', 'Please select OSD or video!'), true);
				return false;
			}
			return true;
		}

		// The picture comes straight from GET /api/v1/osd/screenshot: nothing
		// is written to the box, so there is nothing to clean up after
		function showPicture(blob) {
			const img = document.getElementById('screenshot');
			if (shotUrl) URL.revokeObjectURL(shotUrl);
			shotUrl = URL.createObjectURL(blob);
			img.src = shotUrl;
			img.style.display = 'block';
			document.getElementById('placeholder').style.display = 'none';
		}

		async function capture(path, query) {
			if (shotBusy) return false;	// the running one answers
			shotBusy = true;
			try {
				showPicture(await webuiV1Blob(path, Object.assign({at: Date.now()}, query || {})));
			} finally {
				shotBusy = false;
			}
			// the probe at load went unanswered for want of a sign-in, which
			// this capture has just had
			if (displayProbe === 'signin') probeDisplay();
			return true;
		}

		async function doSnapshot() {
			if (!checkEnable()) return;

			// Mobile: show screenshot card
			selectCard('card-screenshot');

			const placeholder = document.getElementById('placeholder');
			const loading = document.getElementById('loading');
			const img = document.getElementById('screenshot');
			const had = img.style.display === 'block';

			if (!had) placeholder.style.display = 'none';
			loading.style.display = had ? 'none' : 'flex';

			try {
				await capture('/osd/screenshot', {
					osd: document.getElementById('checkOSD').checked,
					video: document.getElementById('checkVideo').checked,
					format: 'png'
				});
			} catch (e) {
				// another capture still running keeps the picture there is
				if (e.status !== 409)
					webuiShowToast(webuiL('msg.error', 'Error') + ': ' + e.message, true);
				if (!had) placeholder.style.display = 'flex';
			}
			loading.style.display = 'none';
		}

		// The front display only where the box can read it: 501 says it cannot
		async function probeDisplay() {
			try {
				await webuiV1Blob('/osd/display/screenshot', {at: Date.now()}, {quiet: true});
				document.getElementById('btnGlcd').style.display = '';
				displayProbe = 'shown';
			} catch (e) {
				displayProbe = e.status === 403 ? 'signin' : 'none';
			}
		}
		webuiAfterTexts(probeDisplay);

		async function doGlcdSnapshot(btn) {
			btn.disabled = true;
			try {
				await capture('/osd/display/screenshot');
			} catch (e) {
				webuiShowToast(webuiL('shot.glcdfail', 'GLCD screenshot failed') + ': ' + e.message, true);
			}
			btn.disabled = false;
		}

		function doClear() {
			const img = document.getElementById('screenshot');
			img.style.display = 'none';
			img.removeAttribute('src');
			if (shotUrl) URL.revokeObjectURL(shotUrl);
			shotUrl = null;
			document.getElementById('placeholder').style.display = 'flex';
		}

		// Reload toggle
		document.getElementById('checkReload').addEventListener('change', function() {
			var input = document.getElementById('inputReload');
			input.disabled = !this.checked;

			if (this.checked) {
				var interval = parseInt(input.value) * 1000;
				reloadInterval = setInterval(doSnapshot, interval);
			} else {
				clearInterval(reloadInterval);
				reloadInterval = null;
			}
		});

		// Initialize, once the texts are in
		webuiAfterTexts(doSnapshot);
	</script>
</body>
</html>
