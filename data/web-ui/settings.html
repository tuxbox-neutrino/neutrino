<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.settings" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Settings</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { document.documentElement.setAttribute('data-theme', localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme') || 'dark'); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* Layout as <main>: inherits the global main rule (flex:1,
		   min-height:0, overflow:auto) so long content scrolls and the
		   footer stays below, like every other page.
		   M5b: randlos wie bouquets/timer — keine Zentrierung mehr */
		.webui-settings-layout {
			display: flex;
			gap: 0.5rem;
			padding: 0.5rem;
		}

		/* Sidebar — Panel-Karte in der Optik von bouquets/timer.
		   sticky-Offset bezieht sich auf den Scroller <main> (liegt
		   schon unter dem Header), nicht aufs Fenster: 4.5rem drueckte
		   die Sidebar bei hohen Panels sichtbar nach unten (Audio,
		   Tasten, ...), bei kurzen klemmte der Containing Block sie
		   oben fest — Menue sprang je nach gewaehltem Eintrag */
		.webui-settings-sidebar {
			width: 230px;
			flex-shrink: 0;
			position: sticky;
			top: 0;
			align-self: flex-start;
			max-height: calc(100vh - 7rem);
			overflow-y: auto;
			overflow-x: hidden;
			background: var(--pico-card-background-color);
			border: 1px solid var(--pico-muted-border-color);
			border-radius: var(--webui-radius);
		}
		.settings-nav-head {
			padding: 0.5rem 0.85rem;
			font-size: var(--webui-font-sm);
			font-weight: 600;
			color: var(--pico-color);
			border-bottom: 1px solid var(--pico-muted-border-color);
		}
		#settingsSidebar {
			display: block;
			padding: 0.1rem 0 0.25rem;
		}
		/* Gruppen-Zwischentitel (Optik wie .webui-form-section-title).
		   Kompakte Zeilen: alle 6 Gruppen + 17 Einträge müssen bis
		   900px Fensterhöhe ohne Sidebar-Scroll sichtbar sein */
		#settingsSidebar .grp {
			padding: 0.4rem 0.75rem 0.15rem;
			font-size: var(--webui-font-xs);
			color: var(--webui-accent);
			text-transform: uppercase;
			letter-spacing: 0.08em;
			font-weight: 600;
			line-height: 1.2;
		}
		#settingsSidebar button {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			width: 100%;
			text-align: left;
			padding: 0.3rem 0.75rem;
			font-size: var(--webui-font-sm);
			line-height: 1.2;
			color: var(--pico-muted-color);
			background: none;
			border: none;
			border-left: 3px solid transparent;
			border-radius: 0;
			cursor: pointer;
			transition: var(--webui-transition);
			margin: 0;
		}
		#settingsSidebar button svg {
			flex-shrink: 0;
		}
		#settingsSidebar button:hover {
			color: var(--webui-accent);
			background: var(--webui-accent-light);
		}
		#settingsSidebar button.active {
			color: var(--webui-accent);
			border-left-color: var(--webui-accent);
			font-weight: 600;
			background: var(--webui-accent-light);
		}

		/* Mobile category dropdown — replaces the sidebar below 800px.
		   background-color (NOT the background shorthand) keeps Pico's
		   chevron icon, so the select is recognizable as a dropdown */
		.webui-settings-mobile-nav {
			display: none;
			padding: 0.75rem 1rem 0;
			align-items: center;
			gap: 0.6rem;
		}
		.webui-settings-mobile-nav > svg {
			flex: none;
			width: 18px;
			height: 18px;
			color: var(--webui-accent);
		}
		.webui-settings-mobile-nav select {
			flex: 1;
			width: 100%;
			padding: 0.5rem 2.5rem 0.5rem 0.75rem !important;
			font-size: var(--webui-font-sm);
			margin-bottom: 0 !important;
			height: auto !important;
			border-radius: var(--webui-radius);
			border: 1px solid var(--pico-muted-border-color);
			background-color: var(--pico-card-background-color);
			color: var(--pico-color);
		}

		/* Content area — Karte füllt die Restbreite, der Formular-Inhalt
		   bleibt für die Lesbarkeit auf 720px begrenzt */
		.webui-settings-content {
			flex: 1;
			min-width: 0;
		}
		.settings-card > :not(.settings-card-header) {
			max-width: 720px;
		}

		/* Panels */
		.settings-panel {
			display: none;
		}
		.settings-panel.active {
			display: block;
		}
		.settings-card {
			background: var(--pico-card-background-color);
			border: 1px solid var(--pico-muted-border-color);
			border-radius: var(--webui-radius);
			padding: 1.2rem;
		}
		.settings-card-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 1rem;
			padding-bottom: 0.6rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
		}
		.settings-card-header h3 {
			margin: 0;
			font-size: var(--webui-font-sm);
			font-weight: 600;
			color: var(--pico-color);
		}

		/* Settings-specific form overrides */
		.settings-card .webui-form-row label:not(.webui-toggle) {
			min-width: 10rem;
		}
		.settings-card .webui-form-row select,
		.settings-card .webui-form-row input[type="text"],
		.settings-card .webui-form-row input[type="number"],
		.settings-card .webui-form-row input[type="password"] {
			width: 16rem;
			flex: none;
		}
		.settings-card .webui-form-row input[type="number"] {
			width: 6rem;
		}
		/* Rows of the box's own settings (settings-v1.js): label, help
		   button and restart mark share the label column; the help and a
		   refusal of the box sit below the row, across both columns */
		.webui-set-label {
			display: flex;
			align-items: center;
			gap: 0.3rem;
			min-width: 0;
		}
		/* a long label wraps inside its column instead of pushing the
		   help button under the control (webui.css keeps labels unshrunk) */
		.settings-card .webui-set-label label:not(.webui-toggle) {
			min-width: 0;
			flex-shrink: 1;
			overflow-wrap: anywhere;
		}
		/* a row the parental lock holds says so beside its name */
		.webui-set-locked {
			flex: none;
			font-size: 0.8em;
			color: var(--pico-muted-color);
		}
		.webui-set-info {
			flex: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 1.6rem;
			height: 1.6rem;
			padding: 0;
			margin: 0;
			border: none;
			border-radius: 50%;
			background: none;
			color: var(--pico-muted-color);
			cursor: pointer;
		}
		.webui-set-info:hover,
		.webui-set-info[aria-expanded="true"] {
			color: var(--webui-accent);
		}
		.webui-set-info svg,
		.webui-set-restart svg {
			width: 1rem;
			height: 1rem;
		}
		.webui-set-restart {
			flex: none;
			display: inline-flex;
			color: var(--webui-warning);
		}
		.webui-set-help,
		.webui-set-error {
			grid-column: 1 / -1;
			font-size: var(--webui-font-sm);
		}
		.webui-set-help {
			padding: 0.5rem 0.75rem;
			border-left: 3px solid var(--webui-accent);
			border-radius: 0 var(--webui-radius) var(--webui-radius) 0;
			background: var(--webui-accent-light);
			color: var(--pico-color);
		}
		.webui-set-help[hidden] {
			display: none;
		}
		.webui-set-help p {
			margin: 0 0 0.3rem;
			white-space: pre-line;
		}
		.webui-set-help p:last-child {
			margin-bottom: 0;
		}
		.webui-set-help .webui-set-default {
			color: var(--pico-muted-color);
		}
		.webui-set-error {
			color: var(--webui-danger);
		}
		.settings-card .webui-form-row [aria-invalid="true"] {
			border-color: var(--webui-danger);
		}

		/* M5c: zentrale Dirty-State-Save-Leiste am Fuß der Content-Spalte.
		   Klebt beim Scrollen am unteren Rand und wirkt über der Karte
		   wie deren Fuß (gleicher Hintergrund, border-top als Trenner) */
		.settings-save-bar {
			display: flex;
			gap: 0.5rem;
			align-items: center;
			justify-content: flex-end;
			border-top: 1px solid var(--pico-muted-border-color);
			padding: 0.7rem 1rem;
			position: sticky;
			bottom: 0;
			background: var(--pico-card-background-color);
			border-radius: 0 0 var(--webui-radius) var(--webui-radius);
		}
		/* hidden-Attribut muss gegen das display:flex gewinnen */
		.settings-save-bar[hidden] {
			display: none;
		}
		.settings-save-bar .note {
			margin-right: auto;
			color: var(--pico-muted-color);
			font-size: var(--webui-font-sm);
		}

		/* Mount slots */
		.mount-slot {
			background: var(--pico-background-color);
			border: 1px solid var(--pico-muted-border-color);
			border-radius: var(--webui-radius);
			margin-bottom: 0.5rem;
			overflow: hidden;
		}
		.mount-slot-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0.6rem 0.85rem;
			cursor: pointer;
			font-size: var(--webui-font-sm);
			color: var(--pico-color);
			transition: var(--webui-transition);
		}
		.mount-slot-header:hover {
			background: rgba(255,255,255,0.03);
		}
		.mount-slot-header .slot-summary {
			color: var(--pico-muted-color);
			font-size: var(--webui-font-xs);
			margin-left: 0.5rem;
		}
		.mount-slot-header svg {
			width: 16px;
			height: 16px;
			transition: transform 0.2s;
			flex-shrink: 0;
			color: var(--pico-muted-color);
		}
		.mount-slot.open > .mount-slot-header svg {
			transform: rotate(180deg);
		}
		.mount-slot-body {
			display: none;
			padding: 0.6rem 0.85rem 0.85rem;
			border-top: 1px solid var(--pico-muted-border-color);
		}
		.mount-slot.open > .mount-slot-body {
			display: block;
		}
		.cifs-fields {
			display: none;
		}
		.cifs-fields.visible {
			display: block;
		}

		/* Extensions as a 4-column table (name | slot | active | action) */
		.ext-grid {
			display: grid;
			grid-template-columns: 1fr 140px 52px auto;
			gap: 0.45rem 0.75rem;
			align-items: center;
		}
		.ext-grid .ext-grid-head {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			text-transform: uppercase;
			letter-spacing: 0.08em;
			font-weight: 600;
			padding-bottom: 0.1rem;
		}
		.ext-grid .ext-grid-head.center { text-align: center; }
		.ext-grid .ext-grid-head.right { text-align: right; }
		/* one continuous rule under the header row — per-cell borders
		   would break at the column gaps */
		.ext-grid-rule {
			grid-column: 1 / -1;
			height: 1px;
			background: var(--pico-muted-border-color);
			margin-top: -0.25rem;
		}
		/* centers toggles under their header and kills the inline-block
		   baseline gap that pushed them off the row center */
		.ext-cell-center {
			display: flex;
			align-items: center;
			justify-content: center;
			align-self: stretch;
		}
		.ext-grid select {
			/* block kills the inline baseline gap inside the plain cell
			   div, so the row centers on the select height */
			display: block;
			width: 100%;
			margin: 0;
			padding: 0.2rem 0.4rem !important;
			height: auto !important;
			font-size: var(--webui-font-sm);
		}
		.ext-grid .ext-name {
			font-size: var(--webui-font-sm);
			min-width: 0;
		}
		.ext-grid .ext-actions {
			display: flex;
			gap: 0.35rem;
			justify-content: flex-end;
		}
		.ext-grid .ext-actions .webui-btn {
			padding: 0.25rem 0.5rem;
			font-size: var(--webui-font-xs);
		}
		/* update badge next to the extension name after a manual check */
		.ext-badge {
			display: inline-block;
			padding: 0.05rem 0.45rem;
			border-radius: 999px;
			font-size: var(--webui-font-xs);
			font-weight: 600;
			background: var(--pico-primary);
			color: var(--pico-primary-inverse);
			margin-left: 0.4rem;
			vertical-align: middle;
		}
		@media (max-width: 600px) {
			.ext-grid {
				grid-template-columns: minmax(0, 1fr) 90px 44px auto;
				gap: 0.4rem 0.4rem;
			}
		}

		/* Loading */
		.settings-loading {
			text-align: center;
			padding: 3rem;
			color: var(--pico-muted-color);
		}

		/* Mobile — settings-specific overrides (form-row mobile handled by webui.css) */
		@media (max-width: 800px) {
			.webui-settings-sidebar { display: none; }
			.webui-settings-mobile-nav { display: flex; }
			.webui-settings-layout { padding: 0.5rem; }
			.settings-card { padding: 0.8rem; }
			.settings-card .webui-form-row select,
			.settings-card .webui-form-row input[type="text"],
			.settings-card .webui-form-row input[type="number"],
			.settings-card .webui-form-row input[type="password"] {
				width: 100%;
				flex: auto;
			}
		}
	</style>
</head>
<body>
	<div class="webui-header-wrapper" data-page="settings"></div>
	<div class="webui-header-spacer"></div>

	<!-- Mobile category selector -->
	<div class="webui-settings-mobile-nav">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
		<select id="mobileCategorySelect" onchange="switchCategory(this.value)" aria-label="Settings" data-l-aria-label="nav.settings"></select>
	</div>

	<main class="webui-settings-layout">
		<!-- Sidebar -->
		<div class="webui-settings-sidebar">
			<div class="settings-nav-head" data-l="nav.settings">Settings</div>
			<nav id="settingsSidebar"></nav>
		</div>

		<!-- Content: Panels + zentrale Save-Leiste (M5c) -->
		<div class="webui-settings-content">
			<div id="settingsContent">
				<div class="settings-loading" data-l="set.loading">Loading settings...</div>
			</div>
			<div id="settingsSaveBar" class="settings-save-bar" hidden>
				<span class="note"><b id="saveBarCount">0</b> <span data-l="set.unsaved">unsaved changes</span></span>
				<button type="button" class="webui-btn ghost" onclick="discardSettings()" data-l="set.discard">Discard</button>
				<button type="button" class="webui-btn primary" onclick="saveSettings()">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg><span data-l="bqe.save">Save</span>
				</button>
			</div>
		</div>
	</main>

	<!-- settings-registry.js states its labels as it loads, and settings-v1.js
	     builds on it, so the page reads both once the texts are in (the start
	     at the end of this page) -->
	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/settings.js?v=2"></script>
</body>
</html>
