<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Neutrino-Web-UI - Set your own password</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
</head>
<body class="webui-signin">
	<main class="login-wrap webui-card">
		<h1>Neutrino-Web-UI</h1>
		<p class="sub" data-l="pw.intro">This box still uses its first password or a default password anybody can look up. Please set one of your own; until then the web interface is locked.</p>

		<!-- Sets the account's password with PUT /api/v1/account/password, the
		     one route besides login, session and logout a session opened with
		     the password the box shipped with reaches. Loads nothing of the
		     other pages, which would only be refused until this is done. -->
		<form id="pwForm" novalidate>
			<div class="login-flash err" id="pwErr" role="alert" tabindex="-1" hidden></div>

			<div class="login-field">
				<label for="pwCurrent" data-l="pw.current">Current password</label>
				<div class="login-pw-row">
					<input type="password" id="pwCurrent" name="current" autocomplete="current-password" autofocus>
					<button type="button" class="webui-btn" aria-pressed="false" aria-label="Show password" data-l-aria-label="set.pw_show" onclick="loginTogglePw('pwCurrent', this)"></button>
				</div>
			</div>

			<div class="login-field">
				<label for="pwNew" data-l="pw.new">New password (at least 8 characters)</label>
				<div class="login-pw-row">
					<input type="password" id="pwNew" name="password" autocomplete="new-password" minlength="8">
					<button type="button" class="webui-btn" aria-pressed="false" aria-label="Show password" data-l-aria-label="set.pw_show" onclick="loginTogglePw('pwNew', this)"></button>
				</div>
			</div>

			<div class="login-field">
				<label for="pwRepeat" data-l="pw.repeat">Repeat the new password</label>
				<div class="login-pw-row">
					<input type="password" id="pwRepeat" name="repeat" autocomplete="new-password" minlength="8">
					<button type="button" class="webui-btn" aria-pressed="false" aria-label="Show password" data-l-aria-label="set.pw_show" onclick="loginTogglePw('pwRepeat', this)"></button>
				</div>
			</div>

			<button type="submit" id="pwSubmit" class="webui-btn primary" data-l="pw.submit">Set password</button>
		</form>
		<p class="sub login-first" data-l="pw.apps">Remote control apps and scripts that sign in with the old password need the new one afterwards.</p>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-signin.js?v=1"></script>
	<script src="/js/password.js?v=1"></script>
</body>
</html>
