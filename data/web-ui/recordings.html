<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.recordings" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Recordings</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* The recordings (Phase 4): the sources beside the list on a wide
		   screen, a choice above it on a phone; search and order in the
		   list's head; each recording a row whose title opens its details,
		   with Play on TV as its action and the others in a menu. */
		.webui-media {
			display: grid;
			grid-template-columns: fit-content(18rem) minmax(0, 1fr);
			gap: 1rem;
			align-items: start;
			max-width: 1500px;
			margin: 0 auto;
			padding: 1rem;
		}

		/* Pico lays a nav and the lists in it out as a row: here a column */
		.webui-media > nav.webui-media-sources {
			display: block;
			position: sticky;
			top: 0;
		}

		.webui-media-sources ul.webui-source-list {
			display: block;
			margin: 0;
			padding: 0.35rem;
			list-style: none;
		}

		.webui-media-sources .webui-source-list li {
			display: block;
			margin: 0;
			padding: 0;
		}

		.webui-source-list button {
			--pico-color: inherit;
			display: block;
			width: 100%;
			margin: 0;
			padding: 0.45rem 0.7rem;
			border: 0;
			border-radius: var(--webui-radius);
			background: none;
			box-shadow: none;
			color: var(--pico-color);
			font-size: var(--webui-font-sm);
			text-align: left;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.webui-source-list button:hover {
			background: var(--webui-bg-elevated);
		}

		.webui-source-list button[aria-current="true"] {
			background: var(--webui-accent-light);
			color: var(--webui-accent);
			font-weight: 600;
		}

		.webui-media-list-card .webui-card-header {
			flex-wrap: wrap;
		}

		.webui-card-value {
			color: var(--pico-muted-color);
			font-variant-numeric: tabular-nums;
		}

		.webui-media-controls {
			display: flex;
			flex: 1 1 22rem;
			flex-wrap: wrap;
			gap: 0.4rem;
			justify-content: flex-end;
		}

		.webui-media-controls input[type="search"] {
			flex: 1 1 12rem;
			min-width: 0;
		}

		.webui-source-pick {
			display: none;
			flex: 1 1 100%;
			margin: 0;
		}

		.webui-source-pick select {
			margin: 0;
			padding-top: 0.3rem;
			padding-bottom: 0.3rem;
			font-size: var(--webui-font-sm);
		}

		.webui-media-list {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		@media (max-width: 760px) {
			.webui-media {
				grid-template-columns: minmax(0, 1fr);
				padding: 0.75rem;
			}

			.webui-media > nav.webui-media-sources {
				display: none;
			}

			.webui-source-pick {
				display: block;
			}
		}

		.webui-media-controls input,
		.webui-media-controls select {
			margin: 0;
			font-size: var(--webui-font-sm, 0.8rem);
			padding: 0.3rem 0.5rem;
			height: auto;
		}

		.webui-media-sort {
			display: flex;
			gap: 0.3rem;
		}

		.webui-media-row {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			margin: 0;
			padding: 0.45rem 1rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
		}

		/* the title opens the details: a button that reads as a title */
		.webui-media-open {
			--pico-color: inherit;
			display: block;
			width: 100%;
			margin: 0;
			padding: 0;
			border: 0;
			background: none;
			box-shadow: none;
			color: var(--pico-color);
			text-align: left;
		}

		.webui-media-open:hover .webui-media-title {
			color: var(--webui-accent);
		}

		.webui-media-open:focus-visible {
			outline: 2px solid var(--webui-focus-color);
			outline-offset: 2px;
			border-radius: 2px;
		}

		.webui-media-row:hover {
			background: var(--pico-secondary-background, rgba(127, 127, 127, 0.08));
		}

		.webui-media-cover {
			flex: 0 0 4.2rem;
			height: 2.4rem;
			border-radius: 4px;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--pico-muted-border-color);
			color: var(--pico-muted-color);
		}

		.webui-media-cover img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.webui-media-cover svg {
			width: 1.2rem;
			height: 1.2rem;
		}

		.webui-media-info {
			flex: 1;
			min-width: 0;
			line-height: 1.3;
		}

		.webui-media-title {
			font-weight: 600;
			font-size: 0.85rem;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.webui-media-meta {
			font-size: 0.7rem;
			color: var(--pico-muted-color);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.webui-media-title .webui-pill {
			margin-left: 0.4rem;
			vertical-align: 1px;
		}

		.webui-media-actions {
			display: flex;
			gap: 0.25rem;
		}

		.webui-media-actions .webui-btn {
			margin: 0;
			white-space: nowrap;
		}

		.webui-media-actions .webui-btn svg {
			width: 0.9rem;
			height: 0.9rem;
		}

		@media (max-width: 760px) {
			/* the action's word gives way to its symbol on a phone */
			.webui-media-play span {
				display: none;
			}
		}

		.webui-media-note {
			padding: 0.4rem 0.8rem;
			font-size: 0.72rem;
			color: var(--pico-muted-color);
		}

		.webui-media-more {
			display: block;
			margin: 0.6rem auto;
		}

		.webui-media-detail-cover {
			max-width: 100%;
			max-height: 12rem;
			border-radius: 6px;
			display: block;
			margin-bottom: 0.6rem;
		}

		.webui-media-detail-facts {
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.15rem 0.8rem;
			font-size: 0.78rem;
			margin-bottom: 0.6rem;
		}

		.webui-media-detail-facts dt {
			color: var(--pico-muted-color);
		}

		.webui-media-detail-facts dd {
			margin: 0;
		}

		.webui-media-detail-text {
			white-space: pre-wrap;
			font-size: 0.8rem;
		}

		.webui-media-detail-links {
			display: flex;
			flex-wrap: wrap;
			gap: 0.8rem;
			margin-top: 0.6rem;
			font-size: 0.8rem;
		}
	</style>
</head>
<body>
	<!-- Header generated by webui-header.js -->
	<div class="webui-header-wrapper" data-page="recordings"></div>
	<div class="webui-header-spacer"></div>

	<main>
		<div class="webui-media">
			<nav class="webui-card webui-media-sources" aria-labelledby="sources-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="sources-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
						<span data-l="media.sources">Sources</span>
					</h2>
				</header>
				<ul class="webui-source-list" id="sourceList"></ul>
			</nav>

			<section class="webui-card webui-media-list-card" aria-labelledby="media-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/></svg>
						<span id="media-title" data-l="nav.sub_archive">Archive</span>
					</h2>
					<span class="webui-card-value" id="mediaCount"></span>
					<div class="webui-media-controls">
						<input type="search" id="mediaSearch" placeholder="Search titles" data-l-placeholder="media.search" aria-label="Search titles" data-l-aria-label="media.search">
						<select id="mediaSort" aria-label="Sort" data-l-aria-label="media.sort">
							<option value="start" data-l="media.sort_start">Date</option>
							<option value="title" data-l="media.sort_title">Title</option>
							<option value="channel" data-l="media.sort_channel">Channel</option>
							<option value="duration" data-l="media.sort_duration">Length</option>
							<option value="size" data-l="media.sort_size">Size</option>
						</select>
						<select id="mediaOrder" aria-label="Order" data-l-aria-label="media.order">
							<option value="" data-l="media.order_auto">Usual order</option>
							<option value="asc" data-l="media.order_asc">Ascending</option>
							<option value="desc" data-l="media.order_desc">Descending</option>
						</select>
					</div>
					<label class="webui-source-pick">
						<select id="sourceSelect" aria-label="Sources" data-l-aria-label="media.sources"></select>
					</label>
				</header>
				<div class="webui-media-note" id="mediaPartial" hidden data-l="media.partial">A directory is still being read; the list fills in shortly.</div>
				<ul class="webui-media-list" id="mediaList"></ul>
				<button type="button" class="webui-btn webui-media-more" id="mediaMore" hidden data-l="media.more">Load more</button>
			</section>
		</div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/recordings.js?v=1"></script>
</body>
</html>
