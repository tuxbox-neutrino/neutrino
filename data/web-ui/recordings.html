<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.recordings" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Recordings</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { document.documentElement.setAttribute('data-theme', localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme') || 'dark'); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* Two columns like the timer list: sources and sorting, then the list */
		main.webui-media-grid {
			display: grid;
			grid-template-columns: fit-content(18rem) 1fr;
			gap: 0.6rem;
			padding: 0.5rem;
			overflow: hidden;
		}

		@media (max-width: 800px) {
			main.webui-media-grid {
				grid-template-columns: 1fr;
				grid-template-rows: auto 1fr;
			}
		}

		.webui-media-controls {
			display: grid;
			gap: 0.4rem;
			padding: 0.5rem 0.8rem;
		}

		.webui-media-controls input,
		.webui-media-controls select {
			margin: 0;
			font-size: var(--webui-font-sm, 0.8rem);
			padding: 0.3rem 0.5rem;
			height: auto;
		}

		.webui-media-sort {
			display: flex;
			gap: 0.3rem;
		}

		.webui-media-row {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.45rem 0.6rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			cursor: pointer;
		}

		.webui-media-row:hover {
			background: var(--pico-secondary-background, rgba(127, 127, 127, 0.08));
		}

		.webui-media-cover {
			flex: 0 0 4.2rem;
			height: 2.4rem;
			border-radius: 4px;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--pico-muted-border-color);
			color: var(--pico-muted-color);
		}

		.webui-media-cover img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.webui-media-cover svg {
			width: 1.2rem;
			height: 1.2rem;
		}

		.webui-media-info {
			flex: 1;
			min-width: 0;
			line-height: 1.3;
		}

		.webui-media-title {
			font-weight: 600;
			font-size: 0.85rem;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.webui-media-meta {
			font-size: 0.7rem;
			color: var(--pico-muted-color);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.webui-media-badge {
			font-size: 0.62rem;
			font-weight: 600;
			padding: 0.05rem 0.4rem;
			border-radius: 999px;
			background: rgba(59, 130, 246, 0.15);
			color: var(--pico-primary);
			margin-left: 0.4rem;
		}

		.webui-media-actions {
			display: flex;
			gap: 0.25rem;
		}

		.webui-media-actions .webui-btn svg {
			width: 0.9rem;
			height: 0.9rem;
		}

		.webui-media-note {
			padding: 0.4rem 0.8rem;
			font-size: 0.72rem;
			color: var(--pico-muted-color);
		}

		.webui-media-more {
			display: block;
			margin: 0.6rem auto;
		}

		.webui-media-detail-cover {
			max-width: 100%;
			max-height: 12rem;
			border-radius: 6px;
			display: block;
			margin-bottom: 0.6rem;
		}

		.webui-media-detail-facts {
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.15rem 0.8rem;
			font-size: 0.78rem;
			margin-bottom: 0.6rem;
		}

		.webui-media-detail-facts dt {
			color: var(--pico-muted-color);
		}

		.webui-media-detail-facts dd {
			margin: 0;
		}

		.webui-media-detail-text {
			white-space: pre-wrap;
			font-size: 0.8rem;
		}

		.webui-media-detail-links {
			display: flex;
			flex-wrap: wrap;
			gap: 0.8rem;
			margin-top: 0.6rem;
			font-size: 0.8rem;
		}
	</style>
</head>
<body>
	<!-- Header generated by webui-header.js -->
	<div class="webui-header-wrapper" data-page="recordings"></div>
	<div class="webui-header-spacer"></div>

	<main class="webui-media-grid">
		<!-- Sources, search and sorting -->
		<article class="webui-card webui-panel-card webui-card-sm" id="card-sources">
			<header class="webui-card-header" onclick="toggleCard('card-sources')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
					</svg>
					<span data-l="media.sources">Sources</span>
				</h3>
				<span class="webui-card-preview" id="sourcePreview" data-l="media.all">All recordings</span>
			</header>
			<div class="webui-card-body">
				<div class="webui-media-controls">
					<input type="search" id="mediaSearch" placeholder="Search titles" data-l-placeholder="media.search" aria-label="Search titles" data-l-aria-label="media.search">
					<div class="webui-media-sort">
						<select id="mediaSort" aria-label="Sort" data-l-aria-label="media.sort">
							<option value="start" data-l="media.sort_start">Date</option>
							<option value="title" data-l="media.sort_title">Title</option>
							<option value="channel" data-l="media.sort_channel">Channel</option>
							<option value="duration" data-l="media.sort_duration">Length</option>
							<option value="size" data-l="media.sort_size">Size</option>
						</select>
						<select id="mediaOrder" aria-label="Order" data-l-aria-label="media.order">
							<option value="">↕</option>
							<option value="asc">↑</option>
							<option value="desc">↓</option>
						</select>
					</div>
				</div>
				<ul class="webui-plain-list webui-filter-list" id="sourceList">
					<li aria-busy="true" data-l="msg.loading">Loading...</li>
				</ul>
			</div>
		</article>

		<!-- The recordings -->
		<article class="webui-card webui-panel-card webui-card-sm" id="card-recordings">
			<header class="webui-card-header" onclick="toggleCard('card-recordings')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<rect x="2" y="4" width="20" height="16" rx="2"/>
						<path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/>
					</svg>
					<span data-l="nav.recordings">Recordings</span>
				</h3>
				<span class="webui-card-preview" id="mediaPreview">--</span>
				<span class="webui-timer-count" id="mediaCount"></span>
			</header>
			<div class="webui-card-body">
				<div class="webui-media-note" id="mediaPartial" hidden data-l="media.partial">A directory is still being read; the list fills in shortly.</div>
				<ul class="webui-plain-list" id="mediaList">
					<li aria-busy="true" data-l="media.loading">Loading recordings...</li>
				</ul>
				<button type="button" class="webui-btn webui-media-more" id="mediaMore" hidden data-l="media.more">Load more</button>
			</div>
		</article>

		<!-- Mobile Card Indicator -->
		<div class="webui-card-indicator" id="cardIndicator"></div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=62"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/recordings.js?v=1"></script>
</body>
</html>
