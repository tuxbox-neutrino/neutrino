<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.recordings" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Recordings</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* The recordings (Phase 4 C, as on the approved sample page): a bar
		   with the search, the folders as chips, the order and the view; the
		   recordings as tiles with their cover or their channel's logo, or as
		   rows of a list; on a wide screen the one chosen in a column beside
		   them with its details and actions, else in a sheet. */
		.webui-media {
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			gap: 1rem;
			align-items: start;
			max-width: var(--webui-page-max);
			margin: 0 auto;
			padding: 1rem;
		}

		/* The bar stays at the top while the list scrolls under it (main
		   scrolls, webui.css), on the page's ground, which also covers the
		   strip of main's padding above it */
		.webui-media-bar {
			position: sticky;
			top: 0;
			z-index: 3;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.6rem;
			padding-bottom: 0.5rem;
			margin-bottom: -0.5rem;
			background: var(--pico-background-color);
			box-shadow: 0 -1rem 0 var(--pico-background-color);
		}

		.webui-media-bar input[type="search"] {
			flex: 1 1 14rem;
			max-width: 20rem;
			height: 2.4rem;
			margin: 0;
			padding-top: 0;
			padding-bottom: 0;
		}

		/* Pico draws a [role="group"] as a full-width bar of joined fields,
		   its buttons stretched: the chips undo it */
		.webui-media-chips,
		.webui-media-chips[role="group"] {
			--pico-group-box-shadow: none;
			display: flex;
			flex-wrap: wrap;
			gap: 0.35rem;
			width: auto;
			margin: 0;
			padding: 0;
			border: 0;
			background: none;
			box-shadow: none;
		}

		.webui-media-chips button,
		.webui-media-chips[role="group"] > button {
			--pico-color: inherit;
			flex: none;
			max-width: 14rem;
			margin: 0;
			padding: 0.3rem 0.8rem;
			overflow: hidden;
			border: 1px solid var(--pico-muted-border-color);
			border-radius: 999px;
			background: none;
			box-shadow: none;
			color: var(--pico-color);
			font-size: var(--webui-font-sm);
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.webui-media-chips button:is(:hover, :focus, :active) {
			/* Pico's button colour on hover, focus and press outweighs the reset above */
			--pico-color: inherit;
			border-color: var(--webui-accent);
		}

		.webui-media-chips button[aria-pressed="true"] {
			border-color: transparent;
			background: var(--webui-accent-light);
			color: var(--webui-accent);
			font-weight: 600;
		}

		/* the ring inside the chip, as the other lists beside a page's content */
		.webui-media-chips button:focus-visible {
			outline: 2px solid var(--webui-focus-color);
			outline-offset: -2px;
			box-shadow: none;
		}

		.webui-media-count {
			margin-left: auto;
			color: var(--pico-muted-color);
			font-size: var(--webui-font-sm);
			font-variant-numeric: tabular-nums;
			white-space: nowrap;
		}

		.webui-media-order {
			display: flex;
			gap: 0.35rem;
		}

		.webui-media-order select {
			width: auto;
			margin: 0;
			padding-top: 0.3rem;
			padding-bottom: 0.3rem;
			font-size: var(--webui-font-sm);
		}

		.webui-media-list {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.webui-media-list > li {
			list-style: none;
		}

		/* tiles: a picture 16:9 with the length and Play on TV on it, the
		   title and what it is below; the one chosen outlined */
		.webui-media-list.tiles {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
			gap: 1rem;
		}

		.webui-media-list.tiles > li:not(.webui-media-tile) {
			grid-column: 1 / -1;
		}

		.webui-media-tile {
			display: flex;
			flex-direction: column;
			margin: 0;
			overflow: hidden;
			border-radius: var(--webui-radius-lg);
			outline: 2px solid transparent;
			outline-offset: 2px;
			background: var(--pico-card-background-color);
			box-shadow: var(--webui-shadow);
		}

		[data-theme="light"] .webui-media-tile {
			border: 1px solid var(--webui-border-subtle);
		}

		.webui-media-tile.chosen {
			outline-color: var(--webui-accent);
		}

		.webui-media-thumb {
			position: relative;
			display: grid;
			place-items: center;
			aspect-ratio: 16 / 9;
			overflow: hidden;
			background: #1e242e;
			color: #9aa7b5;
		}

		/* a picture in the list opens the recording's details */
		.webui-media-thumb.opens {
			cursor: pointer;
		}

		.webui-media-thumb > img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.webui-media-thumb > svg {
			width: 2rem;
			height: 2rem;
		}

		.webui-media-thumb .webui-media-logo {
			width: 7rem;
			height: 3.2rem;
		}

		.webui-media-tile .webui-media-thumb::after {
			content: "";
			position: absolute;
			inset: auto 0 0 0;
			height: 55%;
			background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
			pointer-events: none;
		}

		.webui-media-len {
			position: absolute;
			right: 0.6rem;
			bottom: 0.6rem;
			z-index: 1;
			padding: 0.1rem 0.45rem;
			border-radius: 0.35rem;
			background: rgba(0, 0, 0, 0.6);
			color: #fff;
			font-size: 0.75rem;
			font-weight: 600;
			font-variant-numeric: tabular-nums;
		}

		.webui-media-tile .webui-media-thumb .webui-pill {
			position: absolute;
			top: 0.6rem;
			left: 0.6rem;
			z-index: 1;
			background: rgba(0, 0, 0, 0.6);
			color: #7ee2a8;
		}

		.webui-media-tile-play {
			position: absolute;
			left: 0.6rem;
			bottom: 0.5rem;
			z-index: 1;
			display: grid;
			place-items: center;
			width: 2.3rem;
			height: 2.3rem;
			margin: 0;
			padding: 0;
			border: 0;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.92);
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
			color: #111;
		}

		.webui-media-tile-play:is(:hover, :focus, :active) {
			--pico-color: #111;
			background: #fff;
			color: #111;
		}

		.webui-media-tile-play:focus-visible {
			outline: 2px solid var(--webui-focus-color);
			outline-offset: 2px;
		}

		.webui-media-tile-play svg {
			width: 0.95rem;
			height: 0.95rem;
			margin-left: 2px;
		}

		/* the title opens the details: a button that reads as a title */
		.webui-media-open {
			--pico-color: inherit;
			display: block;
			width: 100%;
			margin: 0;
			padding: 0;
			border: 0;
			background: none;
			box-shadow: none;
			color: var(--pico-color);
			text-align: left;
		}

		.webui-media-open:is(:hover, :focus, :active) {
			/* Pico's button colour on hover, focus and press outweighs the reset above */
			--pico-color: inherit;
		}

		@media (hover: hover) {
			.webui-media-open:hover .webui-media-title {
				color: var(--webui-accent);
			}
		}

		.webui-media-open:focus-visible {
			outline: 2px solid var(--webui-focus-color);
			outline-offset: 2px;
			border-radius: 2px;
		}

		.webui-media-tile .webui-media-open {
			flex: 1 1 auto;
			padding: 0.6rem 0.75rem 0.75rem;
		}

		.webui-media-title,
		.webui-media-meta {
			display: block;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.webui-media-title {
			font-weight: 600;
			font-size: 0.9rem;
		}

		.webui-media-meta {
			color: var(--pico-muted-color);
			font-size: 0.75rem;
		}

		/* rows: the list view, a card of rows */
		.webui-media-list.rows {
			overflow: hidden;
			border-radius: var(--webui-radius-lg);
			background: var(--pico-card-background-color);
			box-shadow: var(--webui-shadow);
		}

		.webui-media-row {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			margin: 0;
			padding: 0.45rem 1rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
		}

		.webui-media-row.chosen {
			box-shadow: inset 3px 0 0 var(--webui-accent);
		}

		@media (hover: hover) {
			.webui-media-row:hover {
				background: var(--webui-bg-elevated);
			}
		}

		.webui-media-row .webui-media-thumb {
			flex: 0 0 4.2rem;
			height: 2.4rem;
			border-radius: 4px;
		}

		.webui-media-row .webui-media-thumb > svg {
			width: 1.2rem;
			height: 1.2rem;
		}

		.webui-media-row .webui-media-thumb .webui-media-logo {
			width: 3.8rem;
			height: 2rem;
		}

		.webui-media-info {
			flex: 1;
			min-width: 0;
			line-height: 1.3;
		}

		.webui-media-row .webui-media-title .webui-pill {
			margin-left: 0.4rem;
			vertical-align: 1px;
		}

		.webui-media-actions {
			display: flex;
			gap: 0.25rem;
		}

		.webui-media-actions .webui-btn {
			margin: 0;
			white-space: nowrap;
		}

		.webui-media-actions .webui-btn svg {
			width: 0.9rem;
			height: 0.9rem;
		}

		@media (max-width: 760px) {
			.webui-media {
				padding: 0.75rem;
			}

			.webui-media-list.tiles {
				grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
				gap: 0.75rem;
			}

			/* the action's word gives way to its symbol on a phone */
			.webui-media-play span {
				display: none;
			}

			/* the bar that stays in sight takes three short lines: the
			   search; the folders, scrolled sideways, with the count; the
			   order with the view */
			.webui-media-bar {
				gap: 0.4rem;
			}

			.webui-media-bar input[type="search"] {
				flex: 1 1 100%;
				max-width: none;
				height: 2.2rem;
			}

			.webui-media-chips,
			.webui-media-chips[role="group"] {
				flex: 1 1 60%;
				flex-wrap: nowrap;
				min-width: 0;
				overflow-x: auto;
				scrollbar-width: none;
			}

			.webui-media-order {
				flex: 1 1 55%;
				min-width: 0;
			}

			.webui-media-order select {
				flex: 1 1 0;
				min-width: 0;
			}
		}

		.webui-media-note {
			padding: 0.4rem 0.8rem;
			font-size: 0.72rem;
			color: var(--pico-muted-color);
		}

		.webui-media-more {
			display: block;
			margin: 1rem auto 0;
		}

		/* the column beside the list, on a wide screen only */
		.webui-media-detail {
			display: none;
		}

		@media (min-width: 1200px) {
			.webui-media {
				grid-template-columns: minmax(0, 1fr) 22rem;
			}

			.webui-media-bar,
			.webui-media-note {
				grid-column: 1 / -1;
			}

			/* beside the list, below the bar, as high as the room under it
			   (measured by recordings.js), its own content scrolling */
			.webui-media-detail {
				display: block;
				position: sticky;
				top: calc(var(--webui-media-bar-h, 3rem) + 1rem);
				max-height: calc(var(--webui-media-room, 100dvh) - var(--webui-media-bar-h, 3rem) - 2rem);
				overflow-y: auto;
			}
		}

		.webui-media-detail .webui-media-thumb {
			border-radius: 0;
		}

		.webui-media-detail .webui-media-thumb .webui-media-logo {
			width: 10rem;
			height: 4.5rem;
		}

		.webui-media-detail-body {
			padding: 1rem 1.1rem 1.1rem;
		}

		.webui-media-detail-body h2 {
			margin: 0 0 0.2rem;
			font-size: 1.2rem;
			line-height: 1.3;
		}

		.webui-media-detail-sub {
			margin: 0 0 0.75rem;
			color: var(--pico-muted-color);
			font-size: var(--webui-font-sm);
		}

		.webui-media-detail-acts {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 0.5rem;
			margin-top: 1rem;
		}

		.webui-media-detail-acts .webui-btn {
			justify-content: center;
			margin: 0;
			padding: 0.45rem 0.6rem;
			font-size: var(--webui-font-sm);
		}

		.webui-media-detail-acts .webui-btn svg {
			width: 0.95rem;
			height: 0.95rem;
		}

		.webui-media-detail-acts .primary {
			grid-column: 1 / -1;
		}

		/* in the column beside the list its actions stay at its foot while
		   a long text scrolls */
		@media (min-width: 1200px) {
			.webui-media-detail .webui-media-detail-acts {
				position: sticky;
				bottom: -1.1rem;
				margin: 1rem -1.1rem -1.1rem;
				padding: 0.75rem 1.1rem 1.1rem;
				border-top: 1px solid var(--pico-muted-border-color);
				background: var(--pico-card-background-color);
			}
		}

		.webui-media-detail-acts .webui-media-delete {
			color: var(--webui-danger);
		}

		.webui-media-detail-cover {
			max-width: 100%;
			max-height: 12rem;
			border-radius: 6px;
			display: block;
			margin-bottom: 0.6rem;
		}

		.webui-media-detail-facts {
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.15rem 0.8rem;
			font-size: 0.78rem;
			margin: 0 0 0.6rem;
		}

		.webui-media-detail-facts dt {
			color: var(--pico-muted-color);
		}

		.webui-media-detail-facts dd {
			margin: 0;
			overflow-wrap: anywhere;
		}

		.webui-media-detail-text {
			white-space: pre-wrap;
			font-size: 0.8rem;
		}

		.webui-media-detail-links {
			display: flex;
			flex-wrap: wrap;
			gap: 0.8rem;
			margin-top: 0.6rem;
			font-size: 0.8rem;
		}
	</style>
</head>
<body>
	<!-- Header generated by webui-header.js -->
	<div class="webui-header-wrapper" data-page="recordings"></div>
	<div class="webui-header-spacer"></div>

	<main>
		<div class="webui-media">
			<div class="webui-media-bar">
				<input type="search" id="mediaSearch" placeholder="Search titles" data-l-placeholder="media.search" aria-label="Search titles" data-l-aria-label="media.search">
				<div class="webui-media-chips" id="sourceChips" role="group" aria-label="Sources" data-l-aria-label="media.sources"></div>
				<span class="webui-media-count" id="mediaCount"></span>
				<div class="webui-media-order">
					<select title="What the recordings are sorted by" data-l-title="tip.media_sort" id="mediaSort" aria-label="Sort" data-l-aria-label="media.sort">
						<option value="start" data-l="media.sort_start">Date</option>
						<option value="title" data-l="media.sort_title">Title</option>
						<option value="channel" data-l="media.sort_channel">Channel</option>
						<option value="duration" data-l="media.sort_duration">Length</option>
						<option value="size" data-l="media.sort_size">Size</option>
					</select>
					<select title="Ascending or descending" data-l-title="tip.media_order" id="mediaOrder" aria-label="Order" data-l-aria-label="media.order">
						<option value="" data-l="media.order_auto">Usual order</option>
						<option value="asc" data-l="media.order_asc">Ascending</option>
						<option value="desc" data-l="media.order_desc">Descending</option>
					</select>
				</div>
				<div class="webui-seg" role="group" aria-label="View" data-l-aria-label="media.view">
					<button title="Show the recordings as tiles" data-l-title="tip.media_tiles" type="button" id="viewTiles" aria-pressed="true" data-l="media.view_tiles">Tiles</button>
					<button title="Show the recordings as a list" data-l-title="tip.media_list" type="button" id="viewList" aria-pressed="false" data-l="media.view_list">List</button>
				</div>
			</div>
			<div class="webui-media-note" id="mediaPartial" hidden data-l="media.partial">A directory is still being read; the list fills in shortly.</div>
			<div class="webui-media-main">
				<ul class="webui-media-list tiles" id="mediaList" aria-label="Recordings" data-l-aria-label="nav.sub_archive"></ul>
				<button title="Load the next recordings of the list" data-l-title="tip.media_more" type="button" class="webui-btn webui-media-more" id="mediaMore" hidden data-l="media.more">Load more</button>
			</div>
			<aside class="webui-card webui-media-detail" id="mediaDetail" aria-label="The chosen recording" data-l-aria-label="media.chosen"></aside>
		</div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/recordings.js?v=1"></script>
</body>
</html>
