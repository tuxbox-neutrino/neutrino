<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.sub_timers" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Timers</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* The timer list (Phase 4): the filters beside the list on a wide
		   screen, a choice above it on a phone; each timer a row with its
		   kind, title, channel, time, its state and repetition, one main
		   action, the others in a menu, and its details behind a button. */
		.webui-timers {
			display: grid;
			grid-template-columns: fit-content(18rem) minmax(0, 1fr);
			gap: 1rem;
			align-items: start;
			max-width: var(--webui-page-max);
			margin: 0 auto;
			padding: 1rem;
		}

		/* Pico lays a nav and the lists in it out as a row: here a column */
		.webui-timers > nav.webui-timer-filters {
			display: block;
			position: sticky;
			top: 0;
		}

		/* the filters: the shared side list (webui.css), each entry with its icon
		   in front and its count at the end */
		.webui-timer-filters ul.webui-filter-list {
			padding: 0 0.35rem;
		}

		.webui-filter-list button {
			display: flex;
			gap: 0.5rem;
			align-items: center;
			padding: 0.4rem 0.6rem;
			overflow: visible;
		}

		.webui-filter-list button svg {
			flex: none;
			width: 1rem;
			height: 1rem;
			color: var(--pico-muted-color);
		}

		.webui-filter-list .webui-filter-count {
			margin-left: auto;
			min-width: 1.4em;
			color: var(--pico-muted-color);
			font-variant-numeric: tabular-nums;
			text-align: right;
		}

		.webui-filter-new {
			padding: 0.6rem 0.7rem 0.8rem;
		}

		.webui-filter-new .webui-btn {
			width: 100%;
			justify-content: center;
		}

		.webui-filter-pick,
		.webui-timer-new-small {
			display: none;
		}

		.webui-filter-pick {
			flex: 1 1 10rem;
			min-width: 0;
			margin: 0;
		}

		.webui-filter-pick select {
			margin: 0;
			padding-top: 0.3rem;
			padding-bottom: 0.3rem;
			font-size: var(--webui-font-sm);
		}

		.webui-timer-side .webui-card-header {
			flex-wrap: wrap;
		}

		.webui-card-value {
			margin-left: auto;
			color: var(--pico-muted-color);
			font-variant-numeric: tabular-nums;
		}

		.webui-timer-list {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		/* the details button of a row */
		.webui-timer-more {
			--pico-color: inherit;
			display: grid;
			place-items: center;
			width: 2rem;
			height: 2rem;
			margin: 0;
			padding: 0;
			border: 0;
			border-radius: var(--webui-radius);
			background: none;
			box-shadow: none;
			color: var(--pico-muted-color);
		}

		.webui-timer-more:is(:hover, :focus, :active) {
			/* Pico's button colour on hover, focus and press outweighs the reset above */
			--pico-color: inherit;
		}

		@media (hover: hover) {
			.webui-timer-more:hover {
				background: var(--webui-bg-elevated);
			}
		}

		.webui-timer-more svg {
			width: 1rem;
			height: 1rem;
			transition: transform 0.2s ease;
		}

		.webui-timer-more[aria-expanded="true"] svg {
			transform: rotate(180deg);
		}

		/* what is missing or what the box refused, in the form */
		.webui-form-error {
			margin: 0.6rem 0 0;
			color: var(--webui-danger);
			font-size: var(--webui-font-sm);
			font-weight: 550;
		}

		.webui-form-error[hidden] {
			display: none;
		}

		.webui-form-weekdays {
			margin: 0;
			padding: 0;
			border: 0;
		}

		@media (max-width: 760px) {
			.webui-timers {
				grid-template-columns: minmax(0, 1fr);
				padding: 0.75rem;
			}

			.webui-timers > nav.webui-timer-filters {
				display: none;
			}

			.webui-filter-pick,
			.webui-timer-new-small {
				display: block;
			}
		}

		/* Compact card headers */

		/* Filter Card */

		.webui-filter-group-label {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			text-transform: uppercase;
			letter-spacing: 0.05em;
			padding: 0.5rem 0.7rem 0.2rem;
			font-weight: 600;
		}


		/* Timer List Card */


		/* Timer Row */
		.webui-timer-row {
			display: flex;
			flex-direction: column;
			padding: 0.5rem 0.8rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			border-left: 3px solid transparent;
			transition: var(--webui-transition);
			cursor: pointer;
		}

		@media (hover: hover) {
			.webui-timer-row:hover {
				background: var(--webui-accent-light);
			}
		}

		.webui-timer-row.state-running {
			border-left-color: var(--webui-accent);
		}

		.webui-timer-row.state-finished {
			opacity: 0.5;
		}

		.webui-timer-main {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			width: 100%;
		}

		/* Timer type icon */
		.webui-timer-type-icon {
			width: 28px;
			height: 28px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--webui-accent-light);
			border-radius: 50%;
			flex-shrink: 0;
		}

		.webui-timer-type-icon svg {
			width: 14px;
			height: 14px;
			color: var(--webui-accent);
		}

		.webui-timer-type-icon.record {
			background: rgba(239, 68, 68, 0.15);
		}

		.webui-timer-type-icon.record svg {
			color: var(--webui-danger);
		}

		/* Expand chevron */
		.webui-timer-expand-icon {
			width: 14px;
			height: 14px;
			color: var(--pico-muted-color);
			flex-shrink: 0;
			transition: transform 0.2s ease;
		}

		.webui-timer-row.row-expanded .webui-timer-expand-icon {
			transform: rotate(180deg);
		}

		/* Timer info */
		.webui-timer-row-info {
			flex: 1;
			min-width: 0;
		}

		.webui-timer-row-title {
			font-weight: 500;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-size: var(--webui-font-sm);
		}

		.webui-timer-row-meta {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			display: flex;
			align-items: center;
			gap: 0.4rem;
			flex-wrap: wrap;
		}

		.webui-timer-row-channel {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* Time display */
		.webui-timer-row-time {
			text-align: right;
			flex-shrink: 0;
			line-height: 1.3;
		}

		.webui-timer-row-date {
			font-weight: 600;
			font-size: var(--webui-font-sm);
		}

		.webui-timer-row-hours {
			color: var(--pico-muted-color);
			font-size: var(--webui-font-xs);
		}

		/* Badges */
		.webui-timer-badge {
			font-size: 0.6rem;
			padding: 0.1rem 0.35rem;
			border-radius: 8px;
			white-space: nowrap;
			font-weight: 600;
		}

		.webui-timer-badge-repeat {
			background: var(--webui-accent-light);
			color: var(--webui-accent);
		}

		.webui-timer-badge-state {
			background: var(--pico-card-sectioning-background-color);
			color: var(--pico-muted-color);
		}

		.webui-timer-badge-state.running {
			background: rgba(34, 197, 94, 0.15);
			color: var(--webui-success);
			animation: webui-pulse 2s ease-in-out infinite;
		}

		.webui-timer-badge-state.finished {
			background: var(--pico-card-sectioning-background-color);
			color: var(--pico-muted-color);
		}

		/* Timer actions */
		.webui-timer-actions {
			display: flex;
			gap: 0.3rem;
			flex-shrink: 0;
		}

		/* Expandable detail */
		.webui-timer-detail {
			width: 100%;
			max-height: 0;
			overflow: hidden;
			transition: max-height 0.3s ease, padding 0.3s ease;
			padding: 0;
			margin-top: 0.5rem;
			background: var(--pico-card-sectioning-background-color);
			border-radius: var(--webui-radius);
		}

		.webui-timer-row.row-expanded .webui-timer-detail {
			max-height: 400px;
			padding: 0.8rem 1rem;
			overflow-y: auto;
		}

		.webui-timer-detail-grid {
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.3rem 0.8rem;
			font-size: var(--webui-font-sm);
		}

		.webui-timer-detail-label {
			color: var(--pico-muted-color);
			white-space: nowrap;
		}

		.webui-timer-detail-value {
			word-break: break-all;
		}

		/* Timer count in header */
		.webui-timer-count {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			font-weight: normal;
		}

		@media (max-width: 760px) {
			.webui-timer-row {
				padding: 0.4rem 0.6rem;
			}

			.webui-timer-main {
				gap: 0.4rem;
			}

			.webui-timer-actions {
				gap: 0.2rem;
			}

			.webui-timer-row.row-expanded .webui-timer-detail {
				max-height: 60vh;
				padding: 0.7rem 0.8rem;
			}
		}

		[data-theme="light"] .webui-timer-row {
			border-bottom-color: #e5e7eb;
		}

		@media (hover: hover) {
			[data-theme="light"] .webui-timer-row:hover {
				background: #f8f9fa;
			}
		}


		/* Confirm dialog styles moved to webui.css */

		.webui-btn-stop {
			color: var(--webui-danger) !important;
		}

		.webui-btn-stop .btn-label {
			color: var(--webui-danger);
		}

		/* Timer Modal — inherits base styles from webui.css (.webui-modal-*)
		   Uses .webui-modal-backdrop.open class (added by JS) for display.
		   Only timer-specific overrides here, scoped to #timerModalBackdrop. */
		#timerModalBackdrop .webui-modal {
			max-width: 520px;
			width: 94%;
			max-height: 90dvh;
			display: flex;
			flex-direction: column;
		}

		#timerModalBackdrop .webui-modal-header {
			padding: 0.8rem 1rem;
		}

		#timerModalBackdrop .webui-modal-header h3 {
			font-size: 1rem;
		}

		#timerModalBackdrop .webui-modal-body {
			flex: 1;
			overflow-y: auto;
			padding: 0.8rem 1rem;
		}

		/* Timer-specific form overrides (base styles from webui.css) */
		#timerModalBackdrop .webui-form-section {
			margin-bottom: 0.8rem;
		}
		#timerModalBackdrop .webui-form-section-title {
			color: var(--pico-muted-color);
			letter-spacing: 0.05em;
			margin-bottom: 0.4rem;
			padding-bottom: 0.2rem;
		}
		#timerModalBackdrop .webui-form-row {
			gap: 0.5rem;
			margin-bottom: 0.5rem;
			padding: 0;
		}
		#timerModalBackdrop .webui-form-row label {
			min-width: 5.5rem;
		}
		#timerModalBackdrop .webui-form-row select,
		#timerModalBackdrop .webui-form-row input {
			flex: 1;
			min-width: 0;
		}

		.webui-form-row .webui-time-group {
			display: flex;
			gap: 0.4rem;
			flex: 1;
		}

		.webui-form-row .webui-time-group input {
			flex: 1;
		}

		.webui-form-check {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-bottom: 0.3rem;
			font-size: var(--webui-font-sm);
		}

		.webui-form-check input[type="checkbox"] {
			width: 1rem;
			height: 1rem;
			accent-color: var(--webui-accent);
		}

		.webui-form-weekdays {
			display: flex;
			gap: 0.25rem;
			flex-wrap: wrap;
		}

		.webui-form-weekdays label {
			min-width: auto;
			display: flex;
			align-items: center;
			gap: 0.15rem;
			padding: 0.2rem 0.4rem;
			border: 1px solid var(--pico-muted-border-color);
			border-radius: var(--webui-radius);
			cursor: pointer;
			font-size: var(--webui-font-xs);
			transition: var(--webui-transition);
		}

		.webui-form-weekdays input:checked + span {
			color: var(--webui-accent);
		}

		.webui-form-weekdays input {
			display: none;
		}

		.webui-form-weekdays label:has(input:checked) {
			border-color: var(--webui-accent);
			background: var(--webui-accent-light);
		}

		.webui-form-hidden {
			display: none !important;
		}

		/* Timer edit button */
		.webui-btn-edit {
			color: var(--webui-accent);
		}

		.webui-btn-edit .btn-label {
			color: var(--webui-accent);
		}

		@media (max-width: 800px) {
			#timerModalBackdrop .webui-modal {
				width: 98%;
				max-height: 95dvh;
			}

			#timerModalBackdrop .webui-form-row {
				flex-wrap: wrap;
			}

			#timerModalBackdrop .webui-form-row label {
				min-width: 100%;
				margin-bottom: 0.1rem;
			}
		}
	</style>
</head>
<body>
	<!-- Header generated by webui-header.js -->
	<div class="webui-header-wrapper" data-page="timer"></div>
	<div class="webui-header-spacer"></div>

	<main>
		<div class="webui-timers">
			<nav class="webui-card webui-timer-filters" aria-labelledby="filter-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="filter-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg>
						<span data-l="tm.filter">Filter</span>
					</h2>
				</header>
				<p class="webui-filter-group-label" id="filter-type-label" data-l="tm.type">Type</p>
				<ul class="webui-filter-list webui-side-list" id="filterTypes" aria-labelledby="filter-type-label"></ul>
				<p class="webui-filter-group-label" id="filter-state-label" data-l="tm.state">State</p>
				<ul class="webui-filter-list webui-side-list" id="filterStates" aria-labelledby="filter-state-label"></ul>
				<div class="webui-filter-new">
					<button title="A timer for a recording, a switch, standby or a reminder" data-l-title="tip.timer_new" type="button" class="webui-btn primary" onclick="openTimerModal()">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width:1rem;height:1rem"><path d="M12 5v14M5 12h14"/></svg>
						<span data-l="timer.new">New timer</span>
					</button>
				</div>
			</nav>

			<section class="webui-card webui-timer-side" aria-labelledby="timerListTitle">
				<header class="webui-card-header">
					<h2 class="webui-card-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
						<span id="timerListTitle" data-l="nav.sub_timers">Timers</span>
					</h2>
					<label class="webui-filter-pick">
						<select title="Show only the timers of a kind or a state" data-l-title="tip.timer_filter" id="filterSelect" aria-label="Filter" data-l-aria-label="tm.filter"></select>
					</label>
					<span class="webui-card-value" id="timerCount"></span>
					<button title="A timer for a recording, a switch, standby or a reminder" data-l-title="tip.timer_new" type="button" class="webui-btn primary webui-timer-new-small" onclick="openTimerModal()" data-l="timer.new">New timer</button>
				</header>
				<ul class="webui-timer-list" id="timerList"></ul>
			</section>
		</div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/timer.js?v=1"></script>
</body>
</html>
