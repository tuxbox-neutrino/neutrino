<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Neutrino-Web-UI - Timer</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { document.documentElement.setAttribute('data-theme', localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme') || 'dark'); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* 2-column grid layout for timer. Filterspalte bemisst sich am
		   laengsten Eintrag (Labels sind lokalisiert und verschieden
		   lang — fix 220px schnitt die deutschen Namen ab), Deckel
		   18rem; Mobile-Branch unten bleibt einspaltig wie gehabt */
		main.webui-timer-grid {
			display: grid;
			grid-template-columns: fit-content(18rem) 1fr;
			gap: 0.6rem;
			padding: 0.5rem;
			overflow: hidden;
		}

		@media (max-width: 800px) {
			main.webui-timer-grid {
				grid-template-columns: 1fr;
				grid-template-rows: auto 1fr;
			}
		}

		/* Compact card headers */

		/* Filter Card */

		.webui-filter-group-label {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			text-transform: uppercase;
			letter-spacing: 0.05em;
			padding: 0.5rem 0.7rem 0.2rem;
			font-weight: 600;
		}

		/* Abweichungen von .webui-nav-item/.webui-nav-count (webui.css) */
		.webui-filter-item {
			padding: 0.45rem 0.7rem;
		}

		.webui-filter-count {
			min-width: 1.4em;
			text-align: center;
		}

		/* Timer List Card */


		/* Timer Row */
		.webui-timer-row {
			display: flex;
			flex-direction: column;
			padding: 0.5rem 0.8rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			border-left: 3px solid transparent;
			transition: var(--webui-transition);
			cursor: pointer;
		}

		.webui-timer-row:hover {
			background: var(--webui-accent-light);
		}

		.webui-timer-row.state-running {
			border-left-color: var(--webui-accent);
		}

		.webui-timer-row.state-finished {
			opacity: 0.5;
		}

		.webui-timer-main {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			width: 100%;
		}

		/* Timer type icon */
		.webui-timer-type-icon {
			width: 28px;
			height: 28px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--webui-accent-light);
			border-radius: 50%;
			flex-shrink: 0;
		}

		.webui-timer-type-icon svg {
			width: 14px;
			height: 14px;
			color: var(--webui-accent);
		}

		.webui-timer-type-icon.record {
			background: rgba(239, 68, 68, 0.15);
		}

		.webui-timer-type-icon.record svg {
			color: var(--webui-danger);
		}

		/* Expand chevron */
		.webui-timer-expand-icon {
			width: 14px;
			height: 14px;
			color: var(--pico-muted-color);
			flex-shrink: 0;
			transition: transform 0.2s ease;
		}

		.webui-timer-row.row-expanded .webui-timer-expand-icon {
			transform: rotate(180deg);
		}

		/* Timer info */
		.webui-timer-row-info {
			flex: 1;
			min-width: 0;
		}

		.webui-timer-row-title {
			font-weight: 500;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-size: var(--webui-font-sm);
		}

		.webui-timer-row-meta {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			display: flex;
			align-items: center;
			gap: 0.4rem;
			flex-wrap: wrap;
		}

		.webui-timer-row-channel {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* Time display */
		.webui-timer-row-time {
			text-align: right;
			flex-shrink: 0;
			line-height: 1.3;
		}

		.webui-timer-row-date {
			font-weight: 600;
			font-size: var(--webui-font-sm);
		}

		.webui-timer-row-hours {
			color: var(--pico-muted-color);
			font-size: var(--webui-font-xs);
		}

		/* Badges */
		.webui-timer-badge {
			font-size: 0.6rem;
			padding: 0.1rem 0.35rem;
			border-radius: 8px;
			white-space: nowrap;
			font-weight: 600;
		}

		.webui-timer-badge-repeat {
			background: var(--webui-accent-light);
			color: var(--webui-accent);
		}

		.webui-timer-badge-state {
			background: var(--pico-card-sectioning-background-color);
			color: var(--pico-muted-color);
		}

		.webui-timer-badge-state.running {
			background: rgba(34, 197, 94, 0.15);
			color: var(--webui-success);
			animation: webui-pulse 2s ease-in-out infinite;
		}

		.webui-timer-badge-state.finished {
			background: var(--pico-card-sectioning-background-color);
			color: var(--pico-muted-color);
		}

		/* Timer actions */
		.webui-timer-actions {
			display: flex;
			gap: 0.3rem;
			flex-shrink: 0;
		}

		/* Expandable detail */
		.webui-timer-detail {
			width: 100%;
			max-height: 0;
			overflow: hidden;
			transition: max-height 0.3s ease, padding 0.3s ease;
			padding: 0;
			margin-top: 0.5rem;
			background: var(--pico-card-sectioning-background-color);
			border-radius: var(--webui-radius);
		}

		.webui-timer-row.row-expanded .webui-timer-detail {
			max-height: 400px;
			padding: 0.8rem 1rem;
			overflow-y: auto;
		}

		.webui-timer-detail-grid {
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.3rem 0.8rem;
			font-size: var(--webui-font-sm);
		}

		.webui-timer-detail-label {
			color: var(--pico-muted-color);
			white-space: nowrap;
		}

		.webui-timer-detail-value {
			word-break: break-all;
		}

		/* Timer count in header */
		.webui-timer-count {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			font-weight: normal;
		}

		/* Mobile Accordion */
		@media (max-width: 800px) {
			.webui-timer-grid {
				display: flex;
				flex-direction: column;
				gap: 0.4rem;
				overflow: auto;
			}

			.webui-card-indicator {
				display: flex;
			}

			.webui-filter-card,
			.webui-timerlist-card {
				flex: none;
				max-height: none;
				min-height: auto;
			}

			.webui-filter-card .webui-card-header,
			.webui-timerlist-card .webui-card-header {
				cursor: pointer;
				position: relative;
				padding-right: 2rem;
			}

			.webui-filter-card .webui-card-title,
			.webui-timerlist-card .webui-card-title {
				font-size: 0.9rem;
			}

			.webui-card.collapsed .webui-card-preview {
				display: inline-block;
			}

			.webui-card.collapsed .webui-timer-count {
				display: none;
			}

			/* Chevron indicator */
			.webui-filter-card .webui-card-header::after,
			.webui-timerlist-card .webui-card-header::after {
				content: '▼';
				position: absolute;
				right: 0.5rem;
				top: 50%;
				transform: translateY(-50%);
				font-size: 0.55rem;
				color: var(--pico-muted-color);
				transition: transform 0.2s ease;
				pointer-events: none;
			}

			.webui-card:not(.collapsed) .webui-card-header::after {
				transform: translateY(-50%) rotate(180deg);
			}

			.webui-filter-card .webui-card-body,
			.webui-timerlist-card .webui-card-body {
				display: block;
				max-height: 60dvh;
				overflow-y: auto;
			}

			.webui-card.collapsed .webui-card-body {
				display: none;
			}

			.webui-timer-row {
				padding: 0.4rem 0.6rem;
			}

			.webui-timer-main {
				gap: 0.4rem;
			}

			.webui-timer-actions {
				gap: 0.2rem;
			}

			.webui-timer-actions .webui-btn {
				padding: 0.25rem 0.35rem;
			}

			.webui-timer-actions .webui-btn svg {
				width: 13px;
				height: 13px;
			}

			.webui-timer-detail {
				margin-top: 0.4rem;
			}

			.webui-timer-row.row-expanded .webui-timer-detail {
				max-height: 60vh;
				padding: 0.7rem 0.8rem;
			}
		}

		[data-theme="light"] .webui-timer-row {
			border-bottom-color: #e5e7eb;
		}

		[data-theme="light"] .webui-timer-row:hover {
			background: #f8f9fa;
		}


		/* Confirm dialog styles moved to webui.css */

		.webui-btn-stop {
			color: var(--webui-danger) !important;
		}

		.webui-btn-stop .btn-label {
			color: var(--webui-danger);
		}

		/* Timer Modal — inherits base styles from webui.css (.webui-modal-*)
		   Uses .webui-modal-backdrop.open class (added by JS) for display.
		   Only timer-specific overrides here, scoped to #timerModalBackdrop. */
		#timerModalBackdrop .webui-modal {
			max-width: 520px;
			width: 94%;
			max-height: 90dvh;
			display: flex;
			flex-direction: column;
		}

		#timerModalBackdrop .webui-modal-header {
			padding: 0.8rem 1rem;
		}

		#timerModalBackdrop .webui-modal-header h3 {
			font-size: 1rem;
		}

		#timerModalBackdrop .webui-modal-body {
			flex: 1;
			overflow-y: auto;
			padding: 0.8rem 1rem;
		}

		/* Timer-specific form overrides (base styles from webui.css) */
		#timerModalBackdrop .webui-form-section {
			margin-bottom: 0.8rem;
		}
		#timerModalBackdrop .webui-form-section-title {
			color: var(--pico-muted-color);
			letter-spacing: 0.05em;
			margin-bottom: 0.4rem;
			padding-bottom: 0.2rem;
		}
		#timerModalBackdrop .webui-form-row {
			gap: 0.5rem;
			margin-bottom: 0.5rem;
			padding: 0;
		}
		#timerModalBackdrop .webui-form-row label {
			min-width: 5.5rem;
		}
		#timerModalBackdrop .webui-form-row select,
		#timerModalBackdrop .webui-form-row input {
			flex: 1;
			min-width: 0;
		}

		.webui-form-row .webui-time-group {
			display: flex;
			gap: 0.4rem;
			flex: 1;
		}

		.webui-form-row .webui-time-group input {
			flex: 1;
		}

		.webui-form-check {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			margin-bottom: 0.3rem;
			font-size: var(--webui-font-sm);
		}

		.webui-form-check input[type="checkbox"] {
			width: 1rem;
			height: 1rem;
			accent-color: var(--webui-accent);
		}

		.webui-form-weekdays {
			display: flex;
			gap: 0.25rem;
			flex-wrap: wrap;
		}

		.webui-form-weekdays label {
			min-width: auto;
			display: flex;
			align-items: center;
			gap: 0.15rem;
			padding: 0.2rem 0.4rem;
			border: 1px solid var(--pico-muted-border-color);
			border-radius: var(--webui-radius);
			cursor: pointer;
			font-size: var(--webui-font-xs);
			transition: var(--webui-transition);
		}

		.webui-form-weekdays input:checked + span {
			color: var(--webui-accent);
		}

		.webui-form-weekdays input {
			display: none;
		}

		.webui-form-weekdays label:has(input:checked) {
			border-color: var(--webui-accent);
			background: var(--webui-accent-light);
		}

		.webui-form-hidden {
			display: none !important;
		}

		/* Timer edit button */
		.webui-btn-edit {
			color: var(--webui-accent);
		}

		.webui-btn-edit .btn-label {
			color: var(--webui-accent);
		}

		@media (max-width: 800px) {
			#timerModalBackdrop .webui-modal {
				width: 98%;
				max-height: 95dvh;
			}

			#timerModalBackdrop .webui-form-row {
				flex-wrap: wrap;
			}

			#timerModalBackdrop .webui-form-row label {
				min-width: 100%;
				margin-bottom: 0.1rem;
			}
		}
	</style>
</head>
<body>
	<!-- Header generated by webui-header.js -->
	<div class="webui-header-wrapper" data-page="timer"></div>
	<div class="webui-header-spacer"></div>

	<!-- Main Content: 2-Column Grid -->
	<main class="webui-timer-grid">
		<!-- Filter Card -->
		<article class="webui-card webui-panel-card webui-card-sm webui-filter-card" id="card-filter">
			<header class="webui-card-header" onclick="toggleCard('card-filter')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<polygon points="22,3 2,3 10,12.46 10,19 14,21 14,12.46"/>
					</svg>
					Filter
				</h3>
				<span class="webui-card-preview" id="filterPreview" data-l="tm.all">All</span>
			</header>
			<div class="webui-card-body">
				<ul class="webui-plain-list webui-filter-list" id="filterList">
					<li class="webui-filter-group-label">Typ</li>
					<li class="webui-nav-item webui-filter-item active" data-filter="all" onclick="setFilter('all')">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
							<circle cx="12" cy="12" r="10"/>
							<line x1="2" y1="12" x2="22" y2="12"/>
							<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
						</svg>
						<span class="webui-nav-name webui-filter-name" data-l="tm.all">All</span>
						<span class="webui-nav-count webui-filter-count" id="count-all">0</span>
					</li>
					<li class="webui-nav-item webui-filter-item" data-filter="type-5" onclick="setFilter('type-5')">
						<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
						<span class="webui-nav-name webui-filter-name" data-l="bc.recording">Recording</span>
						<span class="webui-nav-count webui-filter-count" id="count-type-5">0</span>
					</li>
					<li class="webui-nav-item webui-filter-item" data-filter="type-3" onclick="setFilter('type-3')">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
						<span class="webui-nav-name webui-filter-name" data-l="tm.zap">Zap</span>
						<span class="webui-nav-count webui-filter-count" id="count-type-3">0</span>
					</li>
					<li class="webui-nav-item webui-filter-item" data-filter="type-4" onclick="setFilter('type-4')">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.364 5.636a9 9 0 11-12.728 12.728 9 9 0 0112.728-12.728zM12 3v4"/></svg>
						<span class="webui-nav-name webui-filter-name">Standby</span>
						<span class="webui-nav-count webui-filter-count" id="count-type-4">0</span>
					</li>
					<li class="webui-nav-item webui-filter-item" data-filter="type-6" onclick="setFilter('type-6')">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
						<span class="webui-nav-name webui-filter-name" data-l="tm.remind">Reminder</span>
						<span class="webui-nav-count webui-filter-count" id="count-type-6">0</span>
					</li>
					<li class="webui-filter-group-label">Status</li>
					<li class="webui-nav-item webui-filter-item" data-filter="state-scheduled" onclick="setFilter('state-scheduled')">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>
						<span class="webui-nav-name webui-filter-name" data-l="tm.planned">Planned</span>
						<span class="webui-nav-count webui-filter-count" id="count-state-scheduled">0</span>
					</li>
					<li class="webui-nav-item webui-filter-item" data-filter="state-running" onclick="setFilter('state-running')">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
						<span class="webui-nav-name webui-filter-name" data-l="tm.active">Active</span>
						<span class="webui-nav-count webui-filter-count" id="count-state-running">0</span>
					</li>
					<li class="webui-nav-item webui-filter-item" data-filter="state-finished" onclick="setFilter('state-finished')">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>
						<span class="webui-nav-name webui-filter-name" data-l="tm.expired">Expired</span>
						<span class="webui-nav-count webui-filter-count" id="count-state-finished">0</span>
					</li>
				</ul>
				<div style="padding:0.5rem 0.8rem 0;">
					<button class="webui-btn" onclick="openTimerModal()" style="display:flex;align-items:center;justify-content:center;gap:0.3rem;width:100%;padding:0.5rem;font-size:0.75rem;cursor:pointer;">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1rem;height:1rem"><path d="M12 5v14m-7-7h14"/></svg>
						<span data-l="timer.new">New timer</span>
					</button>
				</div>
			</div>
		</article>

		<!-- Timer List Card -->
		<article class="webui-card webui-panel-card webui-card-sm webui-timerlist-card" id="card-timers">
			<header class="webui-card-header" onclick="toggleCard('card-timers')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<circle cx="12" cy="12" r="9"/>
						<path d="M12 6v6l4 2"/>
					</svg>
					<span id="timerListTitle">Timer</span>
				</h3>
				<span class="webui-card-preview" id="timerPreview">--</span>
				<span class="webui-timer-count" id="timerCount"></span>
			</header>
			<div class="webui-card-body">
				<ul class="webui-plain-list webui-timer-grid-list" id="timerList">
					<li aria-busy="true" data-l="tm.loading">Loading timers...</li>
				</ul>
			</div>
		</article>

		<!-- Mobile Card Indicator -->
		<div class="webui-card-indicator" id="cardIndicator"></div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=62"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/timer.js?v=1"></script>
</body>
</html>
