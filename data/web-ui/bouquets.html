<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.sub_channels" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - Channels</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
	/* The channel list (Phase 4): the bouquets beside the channels on a wide
	   screen, a choice above them on a phone; each channel a row with its
	   number, logo, name, what runs now, its state, one main action and the
	   others in a menu. */
	/* Only the lists scroll, each in its own box: the bouquets beside the
	   channels, and the head of the channel list with the choice of bouquet
	   on a phone, stand still under the page's head from the start. */
	main {
		display: flex;
		flex-direction: column;
		overflow: hidden;
	}

	.webui-channels {
		display: grid;
		grid-template-columns: 260px minmax(0, 1fr);
		grid-template-rows: minmax(0, 1fr);
		gap: 1rem;
		align-items: start;
		flex: 1 1 auto;
		min-height: 0;
		width: 100%;
		max-width: var(--webui-page-max);
		margin: 0 auto;
		padding: 1rem;
	}

	.webui-bouquet-side,
	.webui-channel-side {
		display: flex;
		flex-direction: column;
		max-height: 100%;
		min-height: 0;
	}

	.webui-bouquet-list,
	.webui-channel-list {
		margin: 0;
		padding: 0;
		list-style: none;
	}

	.webui-bouquet-list {
		overflow-y: auto;
		min-height: 0;
		padding: 0.35rem;
	}

	.webui-channel-list {
		overflow-y: auto;
		min-height: 0;
	}

	/* A screen too low to give the list a height of its own (a phone held
	   across, a page zoomed far, a large font) scrolls the page as a whole
	   again; the threshold in em grows with the browser's font size, the
	   one in px holds for parts that do not */
	@media (max-height: 400px), (max-height: 25em) {
		main {
			overflow: auto;
		}

		.webui-channels {
			flex: none;
			grid-template-rows: auto;
		}

		.webui-bouquet-side,
		.webui-channel-side {
			max-height: none;
		}

		.webui-bouquet-list,
		.webui-channel-list {
			overflow-y: visible;
		}
	}

	/* Pico sets a list in a nav as a row of links: here it is a column */

	.webui-bouquet-pick {
		display: none;
		margin: 0;
		min-width: 0;
		flex: 1 1 12rem;
	}

	.webui-bouquet-pick select {
		margin: 0;
		padding-top: 0.3rem;
		padding-bottom: 0.3rem;
		font-size: var(--webui-font-sm);
	}

	.webui-channel-side .webui-card-header {
		flex-wrap: wrap;
	}

	.webui-card-value {
		margin-left: auto;
		color: var(--pico-muted-color);
		font-variant-numeric: tabular-nums;
		white-space: nowrap;
	}

	/* a channel; its columns and its inset, for each width below. The list
	   carries the inset and its rows reach back over it, so a row and its
	   highlight span the card while its cells keep the inset: a row's own
	   inline padding would, with subgrid, land on its first and last cells
	   as extra margin and squeeze the fixed first column. */
	.webui-channel-list {
		--webui-channel-cols: 3.5ch 96px minmax(10rem, 1fr) minmax(0, 1.4fr) auto auto;
		--webui-channel-gap: 0.75rem;
		--webui-channel-inset: 1rem;
		padding-inline: var(--webui-channel-inset);
	}

	.webui-channel-list > li {
		margin: 0 calc(-1 * var(--webui-channel-inset));
	}

	.webui-channel-row {
		display: grid;
		grid-template-columns: var(--webui-channel-cols);
		gap: var(--webui-channel-gap);
		align-items: center;
		padding: 0.5rem var(--webui-channel-inset);
		border-top: 1px solid var(--pico-muted-border-color);
	}

	.webui-channel-row:first-child {
		border-top: 0;
	}

	.webui-channel-row[aria-current="true"] {
		background: var(--webui-accent-light);
		box-shadow: inset 3px 0 0 var(--webui-accent);
	}

	/* the logo of a channel the box does not show switches to it */
	.webui-channel-row .webui-channel-logo.zaps {
		cursor: pointer;
	}

	/* The rows share the list's columns, so a column starts in every row
	   where it does in the others: on its own, a row gave its name and
	   programme the room its state and actions left, and the playing
	   channel (a pill, no Switch) moved them. A browser without subgrid
	   (Safari before 16, Chrome before 117) draws each row on its own. */
	@supports (grid-template-columns: subgrid) {
		.webui-channel-list {
			display: grid;
			grid-template-columns: var(--webui-channel-cols);
			column-gap: var(--webui-channel-gap);
		}

		.webui-channel-list > li {
			grid-column: 1 / -1;
		}

		.webui-channel-row {
			grid-template-columns: subgrid;
			column-gap: normal;
		}
	}

	.webui-channel-num {
		color: var(--pico-muted-color);
		font-size: var(--webui-font-sm);
		font-variant-numeric: tabular-nums;
		text-align: right;
	}

	.webui-channel-name {
		min-width: 0;
		overflow: hidden;
		font-weight: 550;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.webui-channel-now {
		min-width: 0;
		font-size: var(--webui-font-sm);
	}

	/* the programme: a button that opens its information */
	.webui-channel-now-open {
		display: block;
		width: 100%;
		min-width: 0;
		margin: 0;
		padding: 0.15rem 0.35rem;
		border: 0;
		border-radius: 4px;
		background: none;
		box-shadow: none;
		--pico-color: inherit;
		color: var(--pico-color);
		font: inherit;
		text-align: left;
		cursor: pointer;
	}

	.webui-channel-now-open:is(:hover, :focus, :active) {
		/* Pico's button colour on hover, focus and press outweighs the reset above */
		--pico-color: inherit;
		background: var(--webui-bg-elevated);
	}

	/* the actions of the channel list: the ring inside, as in the other
	   lists, so the card's edge does not cut it off */
	.webui-channel-now-open:focus-visible,
	.webui-channel-acts > .webui-btn:focus-visible {
		outline: 2px solid var(--webui-focus-color);
		outline-offset: -2px;
		box-shadow: none;
	}

	.webui-channel-now-open > span {
		display: block;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.webui-channel-now small {
		color: var(--pico-muted-color);
		font-variant-numeric: tabular-nums;
	}

	.webui-channel-now .webui-progress {
		margin-top: 0.25rem;
		height: 3px;
	}

	.webui-channel-acts {
		display: flex;
		gap: 0.35rem;
		justify-content: flex-end;
	}

	.webui-channel-acts .webui-btn {
		margin: 0;
		white-space: nowrap;
	}

	@media (max-width: 1100px) {
		.webui-channels {
			grid-template-columns: 220px minmax(0, 1fr);
		}

		.webui-channel-list {
			--webui-channel-cols: 3.5ch 80px minmax(0, 1fr) auto auto;
		}

		.webui-channel-logo {
			width: 80px;
			height: 36px;
		}

		/* the programme under the name */
		.webui-channel-name {
			grid-column: 3;
		}

		.webui-channel-now {
			grid-column: 3;
			grid-row: 2;
			margin-top: -0.5rem;
		}

		.webui-channel-row > .webui-channel-state {
			grid-column: 4;
			grid-row: 1 / span 2;
		}

		.webui-channel-acts {
			grid-column: 5;
			grid-row: 1 / span 2;
		}
	}

	@media (max-width: 760px) {
		.webui-channels {
			grid-template-columns: minmax(0, 1fr);
			padding: 0.75rem;
		}

		.webui-bouquet-side {
			display: none;
		}

		.webui-bouquet-pick {
			display: block;
		}

		.webui-channel-list {
			--webui-channel-cols: 64px minmax(0, 1fr) auto;
			--webui-channel-gap: 0.6rem;
			--webui-channel-inset: 0.75rem;
		}

		.webui-channel-num {
			display: none;
		}

		.webui-channel-logo {
			grid-column: 1;
			grid-row: 1 / span 2;
			width: 64px;
			height: 32px;
		}

		.webui-channel-name,
		.webui-channel-now {
			grid-column: 2;
		}

		.webui-channel-row > .webui-channel-state {
			display: none;
		}

		.webui-channel-acts {
			grid-column: 3;
		}
	}
	</style>
</head>
<body>
	<!-- Header wird dynamisch von webui-header.js generiert -->
	<div class="webui-header-wrapper" data-page="bouquets"></div>
	<div class="webui-header-spacer"></div>

	<main>
		<div class="webui-channels">
			<nav class="webui-card webui-bouquet-side" aria-labelledby="bouquet-title">
				<header class="webui-card-header">
					<h2 class="webui-card-title" id="bouquet-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
						<span data-l="nav.bouquets">Bouquets</span>
					</h2>
				</header>
				<ul class="webui-bouquet-list webui-side-list" id="bouquetList" tabindex="-1"></ul>
			</nav>

			<section class="webui-card webui-channel-side" aria-labelledby="currentBouquetName">
				<header class="webui-card-header">
					<h2 class="webui-card-title">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
						<span id="currentBouquetName" data-l="nav.sub_channels">Channels</span>
					</h2>
					<label class="webui-bouquet-pick">
						<select id="bouquetSelect" aria-label="Bouquet" data-l-aria-label="nav.bouquets">
							<option value="" data-l="msg.loading">Loading...</option>
						</select>
					</label>
					<span class="webui-card-value" id="channelCount"></span>
				</header>
				<ul class="webui-channel-list" id="channelList"></ul>
			</section>
		</div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/bouquets.js?v=1"></script>
</body>
</html>
