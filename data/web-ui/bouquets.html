<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Neutrino-Web-UI - Bouquets</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { document.documentElement.setAttribute('data-theme', localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme') || 'dark'); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* 2-column grid layout for bouquets. Bouquetspalte bemisst
		   sich am laengsten Namen (wie Timer-Filter), Deckel 22rem —
		   extrem lange Bouquetnamen ellipsen weiterhin; Mobile-Branch
		   unten bleibt einspaltig wie gehabt */
		main.webui-bouquets-grid {
			display: grid;
			grid-template-columns: fit-content(22rem) 1fr;
			gap: 0.6rem;
			padding: 0.5rem;
			/* Override global main scroll - cards scroll internally */
			overflow: hidden;
		}

		@media (max-width: 800px) {
			main.webui-bouquets-grid {
				grid-template-columns: 1fr;
				grid-template-rows: auto 1fr; /* Bouquets fixed, channels flex */
			}
		}

		/* Compact card headers for both cards */

		/* Bouquet List Card */



		.webui-channel-row {
			display: flex;
			flex-direction: column;
			padding: 0.5rem 0.8rem;
			border-bottom: 1px solid var(--pico-muted-border-color);
			border-left: 3px solid transparent;
			transition: var(--webui-transition);
			cursor: pointer;
		}

		.webui-channel-main {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			width: 100%;
		}

		.webui-channel-row:hover {
			background: var(--webui-accent-light);
		}

		.webui-channel-row.current {
			background: var(--webui-accent-light);
			border-left-color: var(--webui-accent);
		}

		/* Die Logo-Packs bestehen fast nur aus Breitbannern (ZDF 2.8:1
		   bis Sky 8.4:1) — in der kompakten 72px-Kachel skaliert contain
		   ueber die Breite und laesst 8:1-Banner auf ~9px Resthoehe
		   schrumpfen. Mit Logo bekommt die Kachel deshalb Bannerbreite;
		   ohne Logo bleibt der schmale TV-Fallback. */
		.webui-channel-row.has-logo .webui-icon-placeholder {
			width: 160px;
		}

		.webui-channel-info {
			flex: 1;
			min-width: 0;
		}

		.webui-channel-name {
			font-weight: 500;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-size: var(--webui-font-sm);
		}

		.webui-channel-epg {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.webui-channel-progress {
			width: 100%;
			height: 3px;
			margin-top: 4px;
			background: var(--pico-muted-border-color);
			border-radius: 2px;
			overflow: hidden;
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		.webui-channel-progress.active {
			opacity: 1;
		}

		.webui-channel-progress-bar {
			height: 100%;
			background: linear-gradient(90deg, var(--webui-accent), var(--webui-accent-hover));
			border-radius: 2px;
			transition: width 0.5s ease;
		}

		.webui-channel-actions {
			display: flex;
			gap: 0.3rem;
			flex-shrink: 0;
		}

		/* Channel count in header */
		.webui-channel-count {
			font-size: var(--webui-font-xs);
			color: var(--pico-muted-color);
			font-weight: normal;
		}

		/* Mobile Accordion */
		@media (max-width: 800px) {
			.webui-bouquets-grid {
				display: flex;
				flex-direction: column;
				gap: 0.4rem;
				overflow: auto;
			}

			.webui-card-indicator {
				display: flex;
			}

			.webui-bouquet-card,
			.webui-channel-card {
				flex: none;
				max-height: none;
				min-height: auto;
			}

			.webui-bouquet-card .webui-card-header,
			.webui-channel-card .webui-card-header {
				cursor: pointer;
				position: relative;
				padding-right: 2rem;
			}

			.webui-bouquet-card .webui-card-title,
			.webui-channel-card .webui-card-title {
				font-size: 0.9rem;
			}

			/* Show preview only when collapsed */
			.webui-card.collapsed .webui-card-preview {
				display: inline-block;
			}

			/* Hide channel count when collapsed */
			.webui-card.collapsed .webui-channel-count {
				display: none;
			}

			/* Chevron indicator */
			.webui-bouquet-card .webui-card-header::after,
			.webui-channel-card .webui-card-header::after {
				content: '▼';
				position: absolute;
				right: 0.5rem;
				top: 50%;
				transform: translateY(-50%);
				font-size: 0.55rem;
				color: var(--pico-muted-color);
				transition: transform 0.2s ease;
				pointer-events: none;
			}

			/* Chevron rotated when not collapsed (= expanded) */
			.webui-card:not(.collapsed) .webui-card-header::after {
				transform: translateY(-50%) rotate(180deg);
			}

			/* Mobile: show card body by default (graceful fallback without JS) */
			.webui-bouquet-card .webui-card-body,
			.webui-channel-card .webui-card-body {
				display: block;
				max-height: 60dvh;
				overflow-y: auto;
			}

			/* Hide body when JS has initialized and card is collapsed */
			.webui-card.collapsed .webui-card-body {
				display: none;
			}

			.webui-channel-row {
				padding: 0.4rem 0.6rem;
			}

			.webui-channel-main {
				gap: 0.4rem;
			}

			.webui-icon-placeholder {
				width: 44px;
				height: 30px;
			}

			/* Mobile: wenn ein Logo geladen ist, traegt es die Zeile allein —
			   der Textname faellt weg (das Logo hat den Namen als alt), das
			   Logo bekommt den freigewordenen Platz. Faellt das Logo aus
			   (onerror entfernt .has-logo), erscheint der Name wieder. */
			.webui-channel-row.has-logo .webui-icon-placeholder {
				width: 140px;
				height: 40px;
			}

			.webui-channel-row.has-logo .webui-channel-name {
				display: none;
			}

			.webui-channel-actions {
				gap: 0.2rem;
				flex-wrap: wrap;
				justify-content: flex-end;
			}

			.webui-channel-actions .webui-btn {
				padding: 0.25rem 0.35rem;
			}

			.webui-channel-actions .webui-btn svg {
				width: 13px;
				height: 13px;
			}
		}

		[data-theme="light"] .webui-channel-row {
			border-bottom-color: #e5e7eb;
		}

		[data-theme="light"] .webui-channel-row:hover {
			background: #f8f9fa;
		}


		/* Expandable Channel Row Detail */
		.webui-channel-detail {
			width: 100%;
			max-height: 0;
			overflow: hidden;
			transition: max-height 0.3s ease, padding 0.3s ease;
			padding: 0;
			margin-top: 0.5rem;
			background: var(--pico-card-sectioning-background-color);
			border-radius: var(--webui-radius);
		}

		.webui-channel-row.row-expanded .webui-channel-detail {
			max-height: 500px;
			padding: 0.8rem 1rem;
			overflow-y: auto;
		}

		.webui-channel-detail-loading {
			font-size: 0.85rem;
			color: var(--pico-muted-color);
			font-style: italic;
		}

		.webui-channel-detail-content {
			font-size: 0.9rem;
			line-height: 1.6;
			color: var(--pico-color);
		}

		.webui-channel-detail-time {
			font-size: 0.8rem;
			color: var(--pico-muted-color);
			margin-bottom: 0.5rem;
		}

		.webui-channel-detail-title {
			font-weight: 600;
			font-size: 1rem;
			color: var(--webui-accent);
			margin-bottom: 0.5rem;
		}

		.webui-channel-detail-desc {
			font-size: 0.9rem;
			line-height: 1.6;
			white-space: pre-wrap;
			word-wrap: break-word;
		}

		/* Expand indicator on row */
		.webui-channel-row .webui-expand-icon {
			width: 14px;
			height: 14px;
			color: var(--pico-muted-color);
			flex-shrink: 0;
			transition: transform 0.2s ease;
		}

		.webui-channel-row.row-expanded .webui-expand-icon {
			transform: rotate(180deg);
		}

		@media (max-width: 800px) {
			.webui-channel-detail {
				margin-top: 0.4rem;
			}

			.webui-channel-row.row-expanded .webui-channel-detail {
				max-height: 60vh;
				padding: 0.7rem 0.8rem;
			}

			.webui-channel-detail-content {
				font-size: 0.95rem;
			}

			.webui-channel-detail-desc {
				font-size: 0.95rem;
				line-height: 1.7;
			}
		}
	</style>
</head>
<body>
	<!-- Header wird dynamisch von webui-header.js generiert -->
	<div class="webui-header-wrapper" data-page="bouquets"></div>
	<div class="webui-header-spacer"></div>

	<!-- Main Content: 2-Column Grid -->
	<main class="webui-bouquets-grid">
		<!-- Bouquet List Card -->
		<article class="webui-card webui-panel-card webui-card-sm webui-bouquet-card" id="card-bouquets">
			<header class="webui-card-header" onclick="toggleCard('card-bouquets')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M3 6h18M3 12h18M3 18h18"/>
					</svg>
					Bouquets
				</h3>
				<span class="webui-card-preview" id="bouquetPreview">--</span>
			</header>
			<div class="webui-card-body">
				<ul class="webui-plain-list webui-bouquet-list" id="bouquetList">
					<li aria-busy="true" data-l="bq.loading_bouquets">Loading bouquets...</li>
				</ul>
			</div>
		</article>

		<!-- Channel List Card -->
		<article class="webui-card webui-panel-card webui-card-sm webui-channel-card" id="card-channels">
			<header class="webui-card-header" onclick="toggleCard('card-channels')">
				<h3 class="webui-card-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
						<polyline points="17,2 12,7 7,2"/>
					</svg>
					<span id="currentBouquetName" data-l="dash.channels">Channels</span>
				</h3>
				<span class="webui-card-preview" id="channelPreview">--</span>
				<span class="webui-channel-count" id="channelCount"></span>
			</header>
			<div class="webui-card-body">
				<ul class="webui-plain-list webui-channel-grid" id="channelList">
					<li aria-busy="true" data-l="bq.loading_channels">Loading channels...</li>
				</ul>
			</div>
		</article>

		<!-- Mobile Card Indicator -->
		<div class="webui-card-indicator" id="cardIndicator"></div>
	</main>

	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/bouquets.js?v=1"></script>
</body>
</html>
