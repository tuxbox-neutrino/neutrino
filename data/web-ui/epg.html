<!DOCTYPE html>
<html lang="en" data-theme="dark" class="webui-i18n-pending">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title data-l="nav.epg" data-l-prefix="Neutrino-Web-UI - ">Neutrino-Web-UI - EPG</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { var m = localStorage.getItem('webui-mode'); if (m !== 'light' && m !== 'dark') m = (localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme')) === 'light' || matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', m); } catch (e) {}
	</script>
	<link rel="stylesheet" href="/css/pico.min.css?v=1">
	<link rel="stylesheet" href="/css/webui.css?v=90">
	<style>
		/* Program tile colors. These used to be hard-coded dark slate
		   values, which left dark text on a dark tile in the light theme.
		   Both themes now define their own surface, and text on the accent
		   uses the shared --webui-on-accent token instead of plain white. */
		:root {
			--epg-prog-bg: #2a3a4a;
			--epg-prog-border: #3a4a5a;
			--epg-prog-rest: #3a5a6a;
			/* the part of what runs now that has run: the accent tinted into the tile */
			--epg-prog-run: #425a79;
			--epg-row-hover: rgba(255, 255, 255, 0.02);
		}

		[data-theme="light"] {
			--epg-prog-bg: #e8eef5;
			--epg-prog-border: #c3d0de;
			--epg-prog-rest: #cbd8e6;
			--epg-prog-run: #bacadf;
			--epg-row-hover: rgba(0, 0, 0, 0.03);
		}

		.webui-epg-container {
			padding: 0.3rem;
			max-width: 100%;
			overflow-x: auto;
		}

		/* EPG Toolbar - kompakt in einer Zeile */
		.webui-epg-toolbar {
			margin-bottom: 0.3rem;
			padding: 0.25rem 0.4rem;
			flex-wrap: nowrap;
		}

		/* Pico stretches form controls to full width, which blew both
		   selects up and shoved the buttons against the right edge. Size
		   them by content instead: bouquet names need room, the time is
		   always "HH:MM". Vertical padding matches .webui-btn so selects
		   and buttons share one control height; buttons themselves keep
		   the shared component size (no local shrinking). */
		.webui-epg-toolbar .webui-select {
			padding: 0.3rem 0.5rem;
			width: auto;
			min-width: 0;
		}

		.webui-epg-toolbar #bouquetSelect {
			flex: 0 1 16rem;
		}

		/* keep room for Pico's dropdown chevron on the narrow select */
		.webui-epg-toolbar #timeSelect {
			flex: 0 0 auto;
			padding-right: 1.6rem;
		}

		/* EPG Grid */
		.webui-epg-grid {
			background: var(--pico-card-background-color);
			border-radius: var(--webui-radius);
			overflow: hidden;
		}

		/* Time header */
		.webui-epg-time-header {
			display: flex;
			background: var(--pico-card-sectioning-background-color);
			border-bottom: 1px solid var(--pico-muted-border-color);
			position: sticky;
			top: 0;
			z-index: 10;
			position: relative;
		}

		.webui-epg-channel-header {
			min-width: 100px;
			width: 100px;
			padding: 0.4rem 0.5rem;
			font-weight: 600;
			font-size: 0.7rem;
			/* muted is too faint for 11px labels in the light theme */
			color: var(--webui-text-secondary);
			border-right: 1px solid var(--pico-muted-border-color);
			flex-shrink: 0;
		}

		.webui-epg-times {
			display: flex;
			flex: 1;
			overflow: hidden;
		}

		.webui-epg-time-slot {
			flex: 1;
			padding: 0.4rem 0.25rem;
			text-align: left;
			padding-left: 0.5rem;
			font-size: 0.7rem;
			font-weight: 500;
			border-right: 1px solid var(--pico-muted-border-color);
			color: var(--webui-text-secondary);
		}

		/* Channel rows */
		.webui-epg-channels {
			max-height: calc(100vh - 160px);
			overflow-y: auto;
		}

		.webui-epg-row {
			display: flex;
			border-bottom: 1px solid var(--pico-muted-border-color);
			min-height: 52px;
		}

		.webui-epg-row:hover {
			background: var(--epg-row-hover);
		}

		.webui-epg-channel-name {
			min-width: 100px;
			width: 100px;
			padding: 0.25rem 0.4rem;
			display: flex;
			align-items: center;
			font-size: 0.75rem;
			font-weight: 500;
			border-right: 1px solid var(--pico-muted-border-color);
			cursor: pointer;
			flex-shrink: 0;
			line-height: 1.2;
			overflow: hidden;
		}

		.webui-epg-channel-name:hover {
			color: var(--webui-accent);
		}

		.webui-epg-channel-name span {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* a channel: its number and its logo (webuiChannelLogo), its name
		   where it has none */
		.webui-epg-channel-num {
			flex: none;
			min-width: 2.5ch;
			margin-right: 0.4rem;
			color: var(--pico-muted-color);
			font-size: 0.7rem;
			font-variant-numeric: tabular-nums;
			text-align: right;
		}

		.webui-epg-channel-name .webui-channel-logo {
			flex: 1 1 auto;
			min-width: 0;
			width: auto;
			max-width: 112px;
			height: 34px;
		}

		/* Desktop: a wider channel column, banner logos (Sky, 8:1) would
		   shrink to a strip otherwise; a phone keeps the narrow one, where
		   every bit of the programme columns counts */
		@media (min-width: 769px) {
			.webui-epg-channel-header,
			.webui-epg-channel-name {
				min-width: 150px;
				width: 150px;
			}
		}

		.webui-epg-programs {
			flex: 1;
			position: relative;
			overflow: hidden;
			height: 48px;
			min-width: 0;
		}

		/* Program items */
		.webui-epg-program {
			position: absolute;
			top: 2px;
			bottom: 2px;
			background: var(--epg-prog-bg);
			border: 1px solid var(--epg-prog-border);
			border-radius: 3px;
			padding: 2px 6px;
			overflow: hidden;
			cursor: pointer;
			transition: var(--webui-transition);
			font-size: 0.7rem;
			line-height: 1.15;
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.webui-epg-program:hover {
			background: var(--webui-accent);
			border-color: var(--webui-accent);
			color: var(--webui-on-accent);
			z-index: 5;
			box-shadow: 0 2px 8px rgba(0,0,0,0.3);
		}

		/* What runs now: filled as far as it has run, the whole height of its
		   tile, in the accent tinted into the tile, and its edge in the
		   accent. The text keeps its colour, which holds on both parts of
		   the tile (a full accent fill behind it left it without contrast) */
		.webui-epg-program.current {
			background:
				linear-gradient(var(--epg-prog-run), var(--epg-prog-run)) left / var(--progress, 0%) 100% no-repeat,
				var(--epg-prog-bg);
			border-color: var(--webui-accent);
		}

		/* Pico draws a [role="button"] as a filled button with light text:
		   the grid's cells keep their own look */
		.webui-epg-channel-name[role="button"],
		.webui-epg-program[role="button"] {
			--pico-color: inherit;
			color: inherit;
			font-weight: inherit;
			text-align: left;
			text-decoration: none;
			box-shadow: none;
			user-select: auto;
		}

		.webui-epg-channel-name[role="button"]:is(:hover, :focus, :active),
		.webui-epg-program[role="button"]:is(:hover, :focus, :active) {
			/* Pico's button colour on hover, focus and press outweighs the reset above */
			--pico-color: inherit;
		}

		.webui-epg-channel-name[role="button"] {
			margin: 0;
			padding: 0.25rem 0.4rem;
			border: 0;
			border-right: 1px solid var(--pico-muted-border-color);
			border-radius: 0;
			background: none;
			font-weight: 500;
			justify-content: flex-start;
		}

		.webui-epg-program[role="button"]:hover {
			color: var(--webui-on-accent);
		}

		.webui-epg-program:focus-visible,
		.webui-epg-channel-name:focus-visible {
			outline: 2px solid var(--webui-focus-color);
			outline-offset: -2px;
			z-index: 6;
		}

		/* a row the guide knows nothing for in the window */
		.webui-epg-none {
			display: flex;
			align-items: center;
			height: 100%;
			padding: 0 0.6rem;
			color: var(--pico-muted-color);
			font-size: 0.75rem;
			font-style: italic;
		}

		/* the channel the box plays */
		.webui-epg-row.playing .webui-epg-channel-name {
			color: var(--webui-accent);
			font-weight: 700;
			box-shadow: inset 3px 0 0 var(--webui-accent);
		}

		.webui-epg-program.timer-rec {
			border-left: 3px solid var(--webui-danger);
		}

		.webui-epg-program.timer-zap {
			border-left: 3px solid var(--webui-success);
		}

		.webui-epg-program-title {
			font-weight: 600;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			color: inherit;
		}

		.webui-epg-program-time {
			font-size: 0.6rem;
			opacity: 0.7;
			white-space: nowrap;
		}

		/* a sliver at the edge of the window (a programme that began before
		   it, or ends just after it begins): its title and time would only
		   break into pieces, its name is in its label */
		.webui-epg-program.tiny > * {
			visibility: hidden;
		}

		.webui-epg-program:hover .webui-epg-program-time,
		.webui-epg-program.current .webui-epg-program-time {
			opacity: 0.9;
		}

		/* Now marker - small triangle at top of header */
		.webui-epg-now-marker {
			position: absolute;
			bottom: 0;
			transform: translateX(-50%);
			width: 0;
			height: 0;
			border-left: 4px solid transparent;
			border-right: 4px solid transparent;
			border-top: 5px solid #ff4444;
			z-index: 15;
		}

		/* Now line spanning through channels area */
		.webui-epg-now-line {
			position: absolute;
			top: 0;
			bottom: 0;
			width: 1px;
			background: #ff4444;
			opacity: 0.4;
			z-index: 6;
			pointer-events: none;
		}

		/* Responsive */
		@media (max-width: 768px) {
			.webui-epg-toolbar {
				flex-direction: column;
				align-items: stretch;
			}

			.webui-epg-select {
				width: 100%;
			}

			.webui-epg-channel-header,
			.webui-epg-channel-name {
				min-width: 80px;
				width: 80px;
			}

			.webui-epg-time-slot {
				flex: 0 0 60px;
			}
		}
	</style>
</head>
<body>
	<!-- Header wird dynamisch von webui-header.js generiert -->
	<div class="webui-header-wrapper" data-page="epg"></div>
	<div class="webui-header-spacer"></div>

	<!-- Main Content -->
	<main class="webui-epg-container">
		<!-- Toolbar - kompakt in einer Zeile -->
		<div class="webui-toolbar webui-epg-toolbar">
			<select class="webui-select" id="bouquetSelect" aria-label="Bouquet" data-l-aria-label="nav.bouquets">
				<option value="" data-l="msg.loading">Loading...</option>
			</select>
			<select class="webui-select" id="timeSelect" aria-label="From" data-l-aria-label="epg.from"></select>
			<!-- the time nav belongs next to the time it shifts -->
			<div class="webui-btn-group">
				<button type="button" class="webui-btn" onclick="changeTime(-2)" title="2 hours earlier" data-l-title="epg.earlier" aria-label="2 hours earlier" data-l-aria-label="epg.earlier">&lt; -2h</button>
				<button type="button" class="webui-btn" onclick="changeTime(2)" title="2 hours later" data-l-title="epg.later" aria-label="2 hours later" data-l-aria-label="epg.later">+2h &gt;</button>
			</div>
			<button type="button" class="webui-btn primary" onclick="loadEpg()">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
					<polyline points="23,4 23,10 17,10"/>
					<path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
				</svg>
				<span data-l="si.refresh">Refresh</span>
			</button>
		</div>

		<!-- EPG Grid -->
		<div class="webui-epg-grid" id="epgGrid"></div>
	</main>

	<!-- Detail Modal -->
	<script src="/js/webui-i18n.js?v=2"></script>
	<script src="/js/webui-header.js?v=64"></script>
	<script src="/js/webui-dom.js?v=1"></script>
	<script src="/js/webui-v1.js?v=14"></script>
	<script src="/js/epg.js?v=1"></script>
</body>
</html>
