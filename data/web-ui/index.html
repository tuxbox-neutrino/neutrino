<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Neutrino-Web-UI</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: yweb-header.js runs
		// too late, and some pages never load it at all.
		try { document.documentElement.setAttribute('data-theme', localStorage.getItem('yweb-theme') || 'dark'); } catch (e) {}
	</script>
	<style>
		/* This page loads no stylesheet, so paint the canvas here — the
		   redirect waits for a request and would flash white otherwise.
		   Colors match Pico's --pico-background-color. */
		:root { color-scheme: dark; background: #13171f; }
		:root[data-theme="light"] { color-scheme: light; background: #fff; }
	</style>
</head>
<body>
	<noscript><a href="/dashboard.yhtm">Neutrino-Web-UI</a></noscript>
	<script>
		// First run (yWeb.conf startup != true) -> setup wizard,
		// otherwise jump to the configured start page. Any error
		// falls back to the dashboard so the UI is always reachable.
		(function () {
			var fallback = '/dashboard.yhtm';
			// what the classic settings page and the shipped yWeb.conf
			// write ("none" there), mapped onto the modern pages
			var classic = {
				none: 'dashboard.yhtm', bouquets: 'bouquets.yhtm',
				control: 'dashboard.yhtm', remote: 'screenshot.yhtm',
				screenshot: 'screenshot.yhtm'
			};
			fetch('/api/v4/config?config=yweb')
				.then(function (r) { return r.json(); })
				.then(function (data) {
					var cfg = (data && data.data && data.data.config) || {};
					if (cfg.startup !== 'true') {
						location.replace('/wizard.yhtm');
						return;
					}
					var page = cfg.start_page || '';
					if (Object.prototype.hasOwnProperty.call(classic, page))
						page = classic[page];
					// a page of this UI only, never an address elsewhere and
					// never this page itself (it would load itself forever)
					if (!/^\/?[A-Za-z0-9_-]+\.yhtm$/.test(page))
						page = 'dashboard.yhtm';
					if (page.charAt(0) !== '/') page = '/' + page;
					location.replace(page);
				})
				.catch(function () { location.replace(fallback); });
		})();
	</script>
</body>
</html>
