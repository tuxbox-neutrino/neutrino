<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Neutrino-Web-UI</title>
	<link rel="icon" href="/favicon/favicon.ico">
	<script>
		// Apply the stored theme before first paint: webui-header.js runs
		// too late, and some pages never load it at all.
		try { document.documentElement.setAttribute('data-theme', localStorage.getItem('webui-theme') || localStorage.getItem('yweb-theme') || 'dark'); } catch (e) {}
	</script>
	<style>
		/* This page loads no stylesheet, so paint the canvas here — the
		   redirect waits for a request and would flash white otherwise.
		   Colors match Pico's --pico-background-color. */
		:root { color-scheme: dark; background: #13171f; }
		:root[data-theme="light"] { color-scheme: light; background: #fff; }
	</style>
</head>
<body>
	<noscript><a href="/dashboard.yhtm">Neutrino-Web-UI</a></noscript>
	<script>
		// First run (yWeb.conf startup != true) -> setup wizard,
		// otherwise jump to the configured start page. Any error
		// falls back to the dashboard so the UI is always reachable.
		(function () {
			var fallback = '/dashboard.yhtm';
			// what the classic settings page and the shipped yWeb.conf
			// write ("none" there), mapped onto the modern pages
			var classic = {
				none: 'dashboard.yhtm', bouquets: 'bouquets.yhtm',
				control: 'dashboard.yhtm', remote: 'screenshot.yhtm',
				screenshot: 'screenshot.yhtm'
			};
			// the web interface's own settings, readable from the home network
			fetch('/api/v1/webui/settings', {credentials: 'same-origin', cache: 'no-store'})
				.then(function (r) {
					/* off the home network without a session: the sign-in;
					   a session that still owes the owner's own password: the
					   page that sets it. Both come back here to decide. */
					if (r.status === 403) {
						return r.json().catch(function () { return null; }).then(function (p) {
							var owed = p && p.type === '/errors/password-change-required';
							location.replace((owed ? '/password.html' : '/login.html') + '?next=%2F');
							throw new Error('sign-in');
						});
					}
					if (!r.ok) throw new Error(r.status);
					return r.json();
				})
				.then(function (data) {
					var cfg = {};
					((data && data.items) || []).forEach(function (it) { cfg[it.key] = it.value; });
					if (cfg.startup !== 'true') {
						location.replace('/wizard.yhtm');
						return;
					}
					var page = cfg.start_page || '';
					if (Object.prototype.hasOwnProperty.call(classic, page))
						page = classic[page];
					// a page of this UI only, never an address elsewhere and
					// never this page itself (it would load itself forever)
					if (!/^\/?[A-Za-z0-9_-]+\.yhtm$/.test(page))
						page = 'dashboard.yhtm';
					if (page.charAt(0) !== '/') page = '/' + page;
					location.replace(page);
				})
				.catch(function (e) {
					// on the way to the sign-in already
					if (e && e.message === 'sign-in') return;
					location.replace(fallback);
				});
		})();
	</script>
</body>
</html>
