name: Web-UI Version Bump

# The Neutrino-Web-UI carries its own SemVer line in data/web-ui/version.txt
# (version=, date=), separate from the calendar line configure.ac keeps for
# neutrino and from nhttpd's in src/nhttpd/yconfig.h. The pages show it in
# their footer and on the system page. This workflow moves it, and the date
# beside it, whenever the interface changed: its pages, scripts, styles, texts
# and the extensions it ships.
#
# neutrino's configure.ac line deliberately keeps moving on the same push:
# the interface is installed with neutrino, so a change to it does change what
# neutrino ships, and version-bump.yaml gets no ignore glob for data/web-ui.
# Both workflows then push a commit; that race is expected and handled the way
# nhttpd-version.yaml handles it: this one re-reads the tip and recomputes, the
# other rebases its derived count.
#
# The loop this could otherwise close, and the three layers that stop it:
#   - version.txt sits inside the watched tree, so it is excluded from the
#     trigger below: a push that touches nothing else -- a minor or major set
#     by hand -- starts no run. Pushed together with another interface change
#     it is bumped once more on top. The dispatch below is the intended way to
#     set a minor or major.
#   - Pushes made with GITHUB_TOKEN start no workflow runs.
#   - The skip token in the commit message is the third layer, for the day
#     someone pushes the bot's commit on with a PAT.
#
# There is deliberately no concurrency group: a group holds at most one pending
# run and evicts it when another queues, and an evicted run could never make up
# its bump. So every run executes, and the push below re-reads the tip and
# recomputes whenever it lost a race.
#
# No ./.github/actions/setup-tagit for the same reason as nhttpd's: it parses
# configure.ac, which has nothing to do with this file. A sed does the job.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Which component to bump (push events always bump patch)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - master
    paths:
      - "data/web-ui/**"
      # The exclusion must stay after every positive pattern: filters are read
      # in order and the last match for a file wins.
      - "!data/web-ui/version.txt"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      # branches: under push: does not constrain workflow_dispatch -- without
      # this, a manual run commits and pushes to whatever branch it was
      # started on.
      - name: Refuse to run off master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::This workflow commits a version and only runs on master (got ${GITHUB_REF})."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Bump Web-UI version
        env:
          LEVEL: ${{ inputs.level || 'patch' }}
          FILE: data/web-ui/version.txt
        run: |
          set -euo pipefail

          # Same identity the setup-tagit action uses, kept in step by hand.
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          read_version() {
            sed -n -E 's/^version=([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' "$FILE"
          }
          # The date the way the file has always carried it, in the zone the
          # boxes this ships for are mostly in.
          write_version() {
            local day
            day="$(TZ=Europe/Berlin date +%d.%m.%Y)"
            sed -i -E "s/^version=.*/version=$1/; s/^date=.*/date=${day}/" "$FILE"
          }

          # Reads the file as it is now, computes the target, writes it, reads
          # it back and commits. Every failure ends the run red: the number
          # always moves, so a file that does not read back as written is a
          # broken write, not a no-op. Called again after a rejected push,
          # against the refreshed tip.
          bump_and_commit() {
            local current major minor patch v want got
            current="$(read_version)"
            if [ -z "$current" ]; then
              echo "::error::No version=X.Y.Z line found in ${FILE}"
              exit 1
            fi

            IFS=. read -r major minor patch <<<"$current"
            # No leading zeros: bash reads 08 as octal and the arithmetic
            # below would die without tripping errexit.
            for v in major minor patch; do
              if ! [[ ${!v:-} =~ ^(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Invalid ${v} in ${FILE}: version reads '${current}'"
                exit 1
              fi
            done

            case "$LEVEL" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
              *) echo "::error::Unknown level '${LEVEL}'"; exit 1 ;;
            esac
            want="${major}.${minor}.${patch}"

            write_version "$want"
            got="$(read_version)"
            if [ "$got" != "$want" ]; then
              echo "::error::Wrote ${want} but ${FILE} reads back ${got}"
              exit 1
            fi
            if ! grep -q '^date=' "$FILE"; then
              echo "::error::No date= line in ${FILE}"
              exit 1
            fi

            git add "$FILE"
            # The run URL keeps two runs from the same tip in the same second
            # apart, which would otherwise build identical commits and lose a
            # bump behind a green "Everything up-to-date".
            git commit -m "build (ci): bump web-ui version to ${want} [skip ci]" \
              -m "Run: ${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-0}/attempts/${GITHUB_RUN_ATTEMPT:-1}"
            echo "web-ui ${want}"
          }

          bump_and_commit

          attempt=1
          until git push origin "HEAD:${GITHUB_REF_NAME}"; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::Could not push after ${attempt} attempts"
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}); re-reading the tip"
            sleep $((attempt * 3))
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            bump_and_commit
            attempt=$((attempt + 1))
          done
